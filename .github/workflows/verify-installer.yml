name: Verify downloadable installer
# The prepared bundle is only rebuilt when a version is released, so content
# merged to main between releases is expected to be missing from it. Check the
# bundle where it changes: release branches, version tags and PRs that touch it.
on:
  push:
    branches: ['release/**']
    tags: ['v*']
  pull_request:
    paths: ['.release/**']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/verify_prepared_bundle.py

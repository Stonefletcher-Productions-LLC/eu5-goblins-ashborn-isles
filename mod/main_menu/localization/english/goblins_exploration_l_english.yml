l_english:
 goblins_exploration.6.title: "Strange Visitors on Our Shores"
 goblins_exploration.6.desc: "Fishermen report that a strange little vessel put ashore along our coast. Its crew were unlike any people they had seen: short, ugly creatures with long pointed ears, sharp teeth and restless eyes. They picked through the shallows and argued in a rasping tongue, but the moment they realized they had been spotted, they scrambled aboard and fled out to sea.\n\nA scout ship followed at a cautious distance, keeping their patched sails just within sight. Beyond our familiar waters, the pursuit led to a cluster of smoke-wreathed islands, their coves crowded with crooked docks and more of the same vessels. Our scouts have returned with a chart of the crossing. Whatever these creatures may be, we now know where they live."
 goblins_exploration.6.a: "Mark the islands on our charts. Keep watch on the sea."
 goblins_exploration.1.title: "The Captains Look East"
 goblins_exploration.1.desc: "Our rough charts trace the nearby waters, but the mainland beyond them remains unknown. After years of gathering provisions and seaworthy hulls, the crews are ready. Choose a captain and launch the East Route from the Expeditions panel, and a small fleet will cross the eastern waters, chart its harbors and learn who lives beyond them."
 goblins_exploration.2.title: "A Coast Beyond Counting"
 goblins_exploration.2.desc: "Salt-stained charts cover the council table. Our crews have followed the Portuguese shore from fishing coves to the busy quays of Porto and Lisbon. Beyond the breakers they found people eager to bargain, and watchmen eager to send them away. A foreign sail followed the expedition home; our islands are no longer a secret.\n\n#bold Newly charted:#! The Portuguese coast around Porto, Lisbon and Setubal, and its Atlantic approaches."
 goblins_exploration.2.a: "Keep the charts dry. There will be more voyages."
 goblins_exploration.3.title: "The Captains Unroll Their Charts"
 goblins_exploration.3.desc: "We have charted the first eastern harbors, but the world beyond them is still blank. Some crews want the cold northern seas and the crowded straits where the great kingdoms trade. Others have heard Portuguese sailors speak of islands far to the south-west, where a mountain burns above the sea, and of a long African coast beyond them. The North and South Routes are ready in the Expeditions panel."
 goblins_exploration.4.title: "Cold Seas and Foreign Harbors"
 goblins_exploration.4.desc: "The returning ships wear a crust of salt and carry a hold full of stories. Our captains have sounded the cold harbors of Britain and followed the crowded French shore. In foreign taverns they bartered for charts of Spanish coves and the sunlit ports of Morocco. Dock by dock, the distant world takes shape on the council table. Ships can now seek those shores, and their rulers have heard of the Ashborn Isles.\n\n#bold Newly charted:#! Pockets of southern Britain, the French Atlantic coast, Galicia and the Spanish straits, and northern Morocco; the markets at London, Bordeaux, Seville and Fez and the seas between these shores."
 goblins_exploration.4.a: "Another stretch of the world has a name."
 goblins_exploration.5.title: "Islands of Fire"
 goblins_exploration.5.desc: "Warm winds bring the southern expedition home, and the crews cannot stop talking. Far to the south-west they found islands of black rock and ash, and above them a mountain smoking like our own. Some swear the islanders herd goats on its slopes and fear it as we revere ours. On the long coast beyond, they traded at walled ports under Moroccan banners and heard of a red city inland, where caravans come out of the desert. The rulers they encountered now know where our islands lie.\n\n#bold Newly charted:#! Madeira and the Canary Islands, the Atlantic coast of Morocco from Rabat to Agadir, the Marrakesh market, and the open sea between them."
 goblins_exploration.5.a: "So the Hunger Below has other mountains."

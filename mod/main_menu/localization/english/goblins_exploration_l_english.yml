 goblins_exploration.1.east_terms: "Pay 5 gold once. Chart the Portuguese coast around Porto, Lisbon and Setubal, and its Atlantic approaches. Most inland territory remains unknown. Travel takes 4 months. When the crew arrives, the current owners of these ports learn the Ashborn homeland and its surrounding waters. Crews then rest for 12 months."
 goblins_exploration.1.wait_terms: "No payment. The next automatic offer is six months away. This also restores reminders if they were stopped."
 goblins_exploration.1.pause: "Stop reminders; I will commission a voyage myself."
 goblins_exploration.1.pause_terms: "No payment. Review Ashborn Voyages in the Ashborn Voyages situation to reopen an available route. Reminders stay off after manual voyages."

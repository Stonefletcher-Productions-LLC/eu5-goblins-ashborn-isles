 ga_charts: "Ports Charted"
 ga_charts_desc: "Harbors on this route where the crew has put in, bargained for charts and learned who rules there."
 ga_voyage_east_expedition: "Ashborn Voyage: East Route"
 ga_voyage_east_expedition_desc: "Send a crew across the eastern water to the coast our fishermen glimpse on clear days. They will put in at the harbors of Porto, Lisbon and Setubal, bargain for charts and learn who rules there."
 ga_voyage_east_expedition_historical_info: "Ashborn crews sail in patched hulls with more hands than food. A captain who comes home is judged by his charts, and by how many of his crew he brought back with him."
 ga_voyage_east_expedition_outcome_overview: "$BULLET$Costs #Y 5#! gold when the fleet sets sail.\n$BULLET$The fleet charts the sea it crosses and puts in at each port for 15 days.\n$BULLET$When it returns, we chart the Portuguese coast around Porto, Lisbon and Setubal, and its Atlantic approaches, and the rulers of those ports learn where the Ashborn Isles lie.\n$BULLET$The crews then rest for 12 months before the next voyage."
 ga_voyage_north_expedition: "Ashborn Voyage: North Route"
 ga_voyage_north_expedition_desc: "Send a crew north along the charted Portuguese shore, past Galicia and the French coast to the cold harbors of Britain and the narrow sea where the great kingdoms trade."
 ga_voyage_north_expedition_historical_info: "Ashborn crews sail in patched hulls with more hands than food. A captain who comes home is judged by his charts, and by how many of his crew he brought back with him."
 ga_voyage_north_expedition_outcome_overview: "$BULLET$Costs #Y 10#! gold when the fleet sets sail.\n$BULLET$The fleet charts the sea it crosses and puts in at each port for 15 days.\n$BULLET$When it returns, we chart pockets of southern Britain, the French Atlantic coast, Galicia and the Spanish straits, and northern Morocco; the markets at London, Bordeaux, Seville and Fez and the seas between these shores, and the rulers of those ports learn where the Ashborn Isles lie.\n$BULLET$The crews then rest for 12 months before the next voyage."
 ga_voyage_south_expedition: "Ashborn Voyage: South Route"
 ga_voyage_south_expedition_desc: "Send a crew south-west, toward the islands where Portuguese sailors say a mountain burns above the sea, and on to the long Moroccan coast beyond them."
 ga_voyage_south_expedition_historical_info: "Ashborn crews sail in patched hulls with more hands than food. A captain who comes home is judged by his charts, and by how many of his crew he brought back with him."
 ga_voyage_south_expedition_outcome_overview: "$BULLET$Costs #Y 10#! gold when the fleet sets sail.\n$BULLET$The fleet charts the sea it crosses and puts in at each port for 15 days.\n$BULLET$When it returns, we chart Madeira and the Canary Islands, the Atlantic coast of Morocco from Rabat to Agadir, the Marrakesh market, and the open sea between them, and the rulers of those ports learn where the Ashborn Isles lie.\n$BULLET$The crews then rest for 12 months before the next voyage."

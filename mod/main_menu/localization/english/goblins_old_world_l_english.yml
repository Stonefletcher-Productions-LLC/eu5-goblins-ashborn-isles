l_english:
 ga_old_world.1.title: "Demons or New Souls?"
 ga_old_world.1.desc: "Since the goblin ships first came to our harbors, the court has argued about nothing else. One bishop calls them demons spat up from the mouth of hell along with their burning islands. A friar who has traded with them swears they pray, mourn their dead and keep their oaths better than most Christians. The court looks to us to decide what the goblins are, and what we will do about them."
 ga_old_world.1.a: "They have souls. Send friars and merchants."
 ga_old_world.1.a_tt: "Every goblin crown gains a lasting favorable opinion of us. A papal legate may later sail to the Isles."
 ga_old_world.1.b: "They are spawn of the pit. Watch the coast."
 ga_old_world.1.b_tt: "Every goblin crown gains a lasting unfavorable opinion of us."
 ga_old_world.2.title: "What the Mainland Says of Us"
 ga_old_world.2.desc: "Our captains come back from foreign ports with more than charts. In every tavern from the Tagus to the straits, they say, the priests argue over whether we are demons or a lost people with souls of our own. Children throw stones at our sailors, and merchants crowd them to buy whatever they carry. The mainland has noticed us. Now we must decide how we want to be seen."
 ga_old_world.2.a: "Send gifts to their churchmen."
 ga_old_world.2.a_tt: "Every foreign court that has met the goblins gains a better opinion of us."
 ga_old_world.2.b: "Let them tell stories. Let them fear us."
 ga_old_world.2.b_tt: "Every foreign court that has met the goblins gains a worse opinion of us."
 ga_old_world.2.c: "Our Oathkeepers will answer their priests."
 ga_old_world.3.title: "An Envoy to Lisbon"
 ga_old_world.3.desc: "The King of Portugal has let it be known that he would receive a goblin envoy, if only to see one with his own eyes. Our captains are already arguing over who should go. Some want to dress the envoy in salvaged silk and send him with chests of obsidian and ember-glass. Others say a plain-spoken captain would do just as well and cost a great deal less."
 ga_old_world.3.a: "Send an envoy in silks, with gifts of obsidian."
 ga_old_world.3.a_tt: "Portugal gains a strong, lasting favorable opinion of us."
 ga_old_world.3.b: "Send a plain-spoken captain."
 ga_old_world.3.b_tt: "Portugal gains a favorable opinion of us."
 ga_old_world.3.c: "We owe the Portuguese nothing. Send no one."
 ga_old_world.4.title: "The Curiosity Cabinets"
 ga_old_world.4.desc: "Foreign nobles have started keeping cabinets of wonders: rooms of shells, bones, foreign coins and strange things from the edges of the world. Goblin things are now the fashion. A merchant offers good silver for obsidian arrowheads, ember-glass beads and carved teeth. He would pay far more for shrine relics, if we were willing to part with them."
 ga_old_world.4.a: "Sell them everything, relics included."
 ga_old_world.4.b: "Sell trinkets and beads, and keep the relics."
 ga_old_world.4.c: "Send one fine piece as a gift instead."
 ga_old_world.4.c_tt: "Every foreign court that has met the goblins gains a better opinion of us."
 ga_old_world.5.title: "A Legate from Rome"
 ga_old_world.5.desc: "A foreign ship has brought a churchman in red who calls himself a legate of the Pope in Rome. He has heard that the goblins have souls, and he has come to save them. He asks leave to preach on our docks and to build a chapel near the harbor. The Oathkeepers ask leave to argue with him in front of the whole town."
 ga_old_world.5.a: "Let him preach and build his chapel."
 ga_old_world.5.a_tt: "Every Catholic court that has met the goblins gains a better opinion of us."
 ga_old_world.5.b: "Let the Oathkeepers debate him before the town."
 ga_old_world.5.c: "Feed him well and send him home."
 ga_old_world.5.c_tt: "Every Catholic court that has met the goblins gains a worse opinion of us."
 ga_owr_new_souls: "New Souls Beyond the Sea"
 ga_owr_spawn_of_the_pit: "Spawn of the Pit"
 ga_owr_gifts_to_churchmen: "Gifts to the Churchmen"
 ga_owr_feared: "Feared Raiders"
 ga_owr_envoy_in_finery: "An Envoy in Finery"
 ga_owr_plain_envoy: "A Plain-Spoken Envoy"
 ga_owr_cabinet_gift: "A Gift for the Cabinet"
 ga_owr_legate_welcomed: "The Legate Was Welcomed"
 ga_owr_legate_dismissed: "The Legate Was Sent Home"
 STATIC_MODIFIER_NAME_ga_owr_mission_to_the_isles: "Mission to the Isles"
 STATIC_MODIFIER_DESC_ga_owr_mission_to_the_isles: "Our clergy and merchants mean to save the souls of the goblins, and to sell them a great deal along the way."
 STATIC_MODIFIER_NAME_ga_owr_watch_on_the_coast: "Watch on the Coast"
 STATIC_MODIFIER_DESC_ga_owr_watch_on_the_coast: "Beacons and watchmen line our shore against the goblin raiders."
 STATIC_MODIFIER_NAME_ga_owr_let_them_fear: "Let Them Fear Us"
 STATIC_MODIFIER_DESC_ga_owr_let_them_fear: "The mainland tells stories about us. Our crews have decided to live up to them."
 STATIC_MODIFIER_NAME_ga_owr_oathkeepers_answer: "The Oathkeepers Answer"
 STATIC_MODIFIER_DESC_ga_owr_oathkeepers_answer: "Our Oathkeepers have sent the foreign priests a reply, with their names and our gods in it."
 STATIC_MODIFIER_NAME_ga_owr_lisbon_factors: "Factors in Lisbon"
 STATIC_MODIFIER_DESC_ga_owr_lisbon_factors: "Goblin factors keep a warehouse on the Lisbon quays and sell ember-glass, salt and obsidian to anyone who asks."
 STATIC_MODIFIER_NAME_ga_owr_relics_sold: "Relics Sold Abroad"
 STATIC_MODIFIER_DESC_ga_owr_relics_sold: "Our shrine relics now sit in foreign cabinets. The Oathkeepers have not forgotten."
 STATIC_MODIFIER_NAME_ga_owr_friars_welcome: "Friars in the Harbor"
 STATIC_MODIFIER_DESC_ga_owr_friars_welcome: "Foreign friars preach on our docks. The crews listen politely and the Oathkeepers glare."

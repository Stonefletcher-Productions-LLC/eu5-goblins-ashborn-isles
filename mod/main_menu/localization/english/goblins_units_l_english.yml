l_english:
 a_ga_obsidian_fletchers: "Obsidian Fletchers"
 a_ga_obsidian_fletchers_desc: "When iron ran short at the Hooktooth passes, Drogg the Stone Fletcher set stonecutters to knapping volcanic glass. Goblin ridge archers still tip their arrows with those black points. They shoot first and cut deep, but their scrap armour gives way quickly, and they fight best on hills and mountains."
 a_ga_blackglass_crossbows: "Blackglass Crossbows"
 a_ga_blackglass_crossbows_desc: "Heavier crossbows loaded with glass-headed bolts. The $a_ga_obsidian_fletchers$' descendants still hold the high ground better than anyone in the Isles."

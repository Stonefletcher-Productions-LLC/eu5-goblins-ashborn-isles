l_english:
 ga_mainland.1.title: "A Goblin Shore"
 ga_mainland.1.desc: "Our banners fly over mainland streets. The old townsfolk watch from their shutters while our crews pace out plots for longhouses, smoke-pits and a shrine to the Hunger Below. Back home, every crowded hearth wants a berth on the next ship. The mainland courts will not leave us here in peace for long.\n\n#bold The Goblin Shore#! - Send settlers, teach the locals our tongue and raise shrines from the situation panel. A crown that turns 5 mainland locations goblin-majority makes the shore ours. European neighbours may take a casus belli to drive us out, and the Goblin Horde answers any outsider who attacks."
 ga_mainland.1.a: "Fill the ships. The shore needs hands."
 ga_mainland.1.b: "Build the stockade first."
 ga_mainland.2.title: "Market Day at the Stockade"
 ga_mainland.2.desc: "Mainland traders have started setting up stalls outside our stockade gates. They sell salt fish, wool and wine, and they buy obsidian and ash-salt at twice what Lisbon pays. Some of our young crews have started trading words as well as goods, and the old captains do not like it."
 ga_mainland.2.a: "Open the gates. Coin is coin."
 ga_mainland.2.b: "Let them learn our tongue, not we theirs."
 ga_mainland.2.c: "Keep the gates shut and the stakes sharp."
 ga_mainland.3.title: "The Old Townsfolk"
 ga_mainland.3.desc: "The families who held our mainland towns before us are still here. They keep their own church, their own guild hall and their own grudges. Some have started leaving for their kin across the border, taking stories of goblin cruelty with them. The rest wait to see what kind of masters we are."
 ga_mainland.3.a: "Let them go. More room for our own."
 ga_mainland.3.a_tt: "Our European neighbours think worse of us."
 ga_mainland.3.b: "Grant them a charter. They keep their guilds; we keep the keys."
 ga_mainland.3.b_tt: "Our European neighbours think better of us."
 ga_mainland.3.c: "Garrison the town and let them grumble."
 ga_mainland.4.title: "Berths to the East"
 ga_mainland.4.desc: "Word of free land on the mainland has run through every homeland harbor. Families sleep on the quays waiting for a ship, and the clan elders complain that the fields are emptying. The quartermasters ask whether to give the berths away or keep the hands at home."
 ga_mainland.4.a: "Give them the berths."
 ga_mainland.4.b: "The homeland needs its hands."
 ga_mainland.5.title: "Goblins on Our Border"
 ga_mainland.5.desc: "Goblins hold a town on our border. Pilgrims swear they have seen the creatures' smoke-shrines from the road, and merchants swear that goblin obsidian is the best they have ever sold. The bishops want the bells rung and the goblins driven into the sea. The merchants would rather keep the road open.\n\nWhatever we choose, any war on a goblin crown brings the whole Goblin Horde against us."
 ga_mainland.5.a: "Ring the bells. Drive them into the sea."
 ga_mainland.5.a_tt: "We gain a 10-year Drive Out the Goblins casus belli on every goblin crown that holds land on our border, and think worse of them."
 ga_mainland.5.b: "Keep the road open, and a sword by the door."
 ga_mainland.5.b_tt: "We and the goblin crowns on our border think better of each other."
 ga_mainland.5.c: "Send friars across the border."
 ga_mainland.5.c_tt: "The goblin crowns on our border think better of us."
 ga_mainland.6.title: "The Bells Ring Against Us"
 ga_mainland.6.desc: "The church bells of [SCOPE.sCountry('ga_ms_accuser').GetName] have rung for three days. Its preachers call us spawn of the pit, and its captains have sworn to drive every goblin on the mainland into the sea. They are counting on fighting one crown alone. They have forgotten the Horde."
 ga_mainland.6.a: "Call the Horde. Every crown answers."
 ga_mainland.6.a_tt: "Every other crown of the Goblin Horde hears our call. Whatever they send, the Horde already joins any war an outsider declares on us."
 ga_mainland.6.b: "Buy them off with gold."
 ga_mainland.6.c: "Let them come."
 ga_mainland.7.title: "Kin Across the Water"
 ga_mainland.7.desc: "[SCOPE.sCountry('ga_ms_kin').GetName] holds a goblin shore on the mainland, and the mainland means to take it back. Its envoy reminds us that whatever blood lies between the crowns, the Horde does not leave kin to the outsiders. The Horde will fight in any war the mainland starts. What else will we send?"
 ga_mainland.7.a: "Send gold for their walls."
 ga_mainland.7.b: "Send settlers to fill their streets."
 ga_mainland.7.b_tt: "Settlers from our homeland join their mainland towns."
 ga_mainland.7.c: "Their shore, their problem."
 ga_mainland.8.title: "Driven Back to the Sea"
 ga_mainland.8.desc: "The last of our mainland towns has fallen. Our crews rowed home through smoke, and the mainland bells rang the whole night. The shore is lost, but the charts are not, and every captain knows the way back."
 ga_mainland.8.a: "We will return."
 ga_mainland.9.title: "The Shore Is Ours"
 ga_mainland.9.desc: "Goblin towns now stand on the mainland, goblin-majority and goblin-built. The old townsfolk have learned our tongue or moved on, our shrines smoke beside their churches, and the mainland courts have stopped calling it a raid and started calling it a border. The Hunger Below has a second home."
 ga_mainland.9.a: "Let the mainland get used to us."
 ga_mainland.10.title: "A Goblin Shore Stands"
 ga_mainland.10.desc: "Another crown has made the mainland shore goblin. Whatever we think of its rulers, the mainland now has goblin towns, and every goblin captain walks a little taller in foreign ports."
 ga_mainland.10.a: "Kin is kin."
 ga_ms_send_settlers: "Send Settlers Across"
 ga_ms_send_settlers_desc: "Pay 20 gold to ship goblin peasants from our capital to one of our mainland locations. The location gets a stockade for ten years. Once every two years."
 ga_ms_teach_tongue: "Teach Them Our Tongue"
 ga_ms_teach_tongue_desc: "Pay 15 gold to bring our tongue and customs to the old townsfolk of one mainland location. A tenth of every non-goblin pop there adopts our culture; the rest resent it for ten years. Once every three years."
 ga_ms_raise_shrine: "Raise a Hunger Shrine"
 ga_ms_raise_shrine_desc: "Pay 15 gold to raise a smoke-shrine to the Hunger Below in one mainland location. A tenth of every pop there of another faith converts. Ashen Covenant crowns only. Once every three years."
 ga_horde_ship_kin: "Ship Kin to the Shore"
 ga_horde_ship_kin_desc: "Pay 10 gold to ship settlers from our capital to the mainland towns of another Horde crown. It gains +30 opinion of us for ten years. Once every five years."

 STATIC_MODIFIER_NAME_ga_ms_first_landing: "Settler Fever"
 STATIC_MODIFIER_DESC_ga_ms_first_landing: "Every crowded hearth in the homeland has a cousin who wants a berth on the next ship east."
 STATIC_MODIFIER_NAME_ga_ms_mixed_market: "Mixed Markets"
 STATIC_MODIFIER_DESC_ga_ms_mixed_market: "Mainland traders haggle at our stockade gates. They still count their fingers after every handshake."
 STATIC_MODIFIER_NAME_ga_ms_hold_the_shore: "Hold the Shore"
 STATIC_MODIFIER_DESC_ga_ms_hold_the_shore: "Every goblin on the mainland sleeps with a blade in reach."
 STATIC_MODIFIER_NAME_ga_ms_let_them_come: "Let Them Come"
 STATIC_MODIFIER_DESC_ga_ms_let_them_come: "Our captains have heard the church bells, and answered with war drums."
 STATIC_MODIFIER_NAME_ga_ms_shore_kingdom: "The Goblin Shore"
 STATIC_MODIFIER_DESC_ga_ms_shore_kingdom: "Goblin towns stand on the mainland, and the mainland has stopped pretending they will go away."
 STATIC_MODIFIER_NAME_ga_ms_back_to_sea: "Driven Back to the Sea"
 STATIC_MODIFIER_DESC_ga_ms_back_to_sea: "The mainland pushed us off its shore. Every crew remembers the names of the towns we lost."
 STATIC_MODIFIER_NAME_ga_ms_bells_rung: "The Bells Rung"
 STATIC_MODIFIER_DESC_ga_ms_bells_rung: "Watchmen on every tower, militia in every square: the goblins will not take another street."
 STATIC_MODIFIER_NAME_ga_ms_shore_market: "Goblin Goods"
 STATIC_MODIFIER_DESC_ga_ms_shore_market: "Obsidian, ash-salt and strange dyes come over the border, and our merchants ask no questions."
 STATIC_MODIFIER_NAME_ga_ms_friars_sent: "Friars Among the Goblins"
 STATIC_MODIFIER_DESC_ga_ms_friars_sent: "Our friars preach in the goblin stockades. Few listen, but the goblins have stopped throwing things."
 STATIC_MODIFIER_NAME_ga_ms_stockade: "Goblin Stockade"
 STATIC_MODIFIER_DESC_ga_ms_stockade: "Sharpened stakes, ash-black banners and a watch that never sleeps."
 STATIC_MODIFIER_NAME_ga_ms_resentment: "Old Townsfolk Resentment"
 STATIC_MODIFIER_DESC_ga_ms_resentment: "The old families of the town remember when the market spoke their tongue."
 ga_goblin_shore: "The Goblin Shore"
 ga_goblin_shore_desc: "Goblin crowns hold land on the European mainland. Settle it, teach the old townsfolk our tongue and raise our shrines, while the mainland courts decide whether to trade with us or drive us into the sea. A crown that turns 5 mainland locations goblin-majority makes the shore a lasting part of the goblin world."
 ga_ms_start_tt: "An independent goblin crown holds land on the European mainland."
 ga_ms_end_tt: "An independent goblin crown owns 5 goblin-majority locations on the European mainland."
 ga_ms_choose_shore: "Choose a Mainland Province"
 ga_ms_no_shore: "@trigger_no! We hold no eligible location on the European mainland."
 ga_ms_kin_shore_tt: "Another crown of the Goblin Horde holds land on the European mainland."
 ga_cb_drive_out_goblins: "Drive Out the Goblins"
 ga_cb_drive_out_goblins_PROV: "Drive the Goblins from $PROVINCE$"
 ga_cb_drive_out_goblins_desc: "Goblins hold land on our border. Take it back through a normal conquest war. The Goblin Horde joins the defense."

 ashen_covenant.10.title: "A Spirit Beyond the Sea"
 ashen_covenant.10.desc: "Our overseas crews return with accounts of a sacred place tended by people beyond the Isles. Some wish to offer useful gifts there; others fear acknowledging powers whose names we barely know. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."
 ashen_covenant.10.a: "Send gifts and learn the foreign observances."
 ashen_covenant.10.a_terms: "Pay 5 gold. +0.5 tolerance of heathens for three years. Replaces any earlier Covenant story consequences. No prestige reward."
 ashen_covenant.10.b: "Support the island shrines and turn the envoys away."

 ashen_covenant.1.title: "The Mountain Answers"
 ashen_covenant.1.desc: "A tremor opens a narrow cavity beneath the First Mouth. Miners want to follow the warm draft; the Ember-speakers demand that the listening fissure be made safe first. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."
 ac_story_available_tt: "This is the current Covenant story, its circumstances still apply, and the required gold or Favor is available."
 ashen_covenant.1.a: "Secure the fissure and hear the witnesses."
 ashen_covenant.1.a_terms: "Pay 5 gold. +5% Oathkeeper estate target satisfaction for three years. Replaces any earlier Covenant story consequences. No prestige reward."
 ashen_covenant.1.b: "Let the miners work; accept the Oathkeepers' anger."
 ashen_covenant.1.b_terms: "No gold cost. -3 Covenant Favor immediately. +5% production efficiency for three years. Replaces any earlier Covenant story consequences. No prestige reward."
 ashen_covenant.1.c: "Defer. Make no commitment for now."
 ashen_covenant.1.c_terms: "No gold, Favor, prestige or modifier change. This closes the story; it does not schedule a follow-up. The normal three-year story cooldown remains."
 ashen_covenant.2.title: "The Flood Remembers"
 ashen_covenant.2.desc: "The stakes at the Listening Pool name a wealthy house that promised labor after the last flood. Its heirs now deny the debt. The Reed-witnesses bring the old flood marks before the crown. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."

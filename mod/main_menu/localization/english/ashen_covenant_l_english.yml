 ashen_covenant.11.title: "The Empty Feast"
 ashen_covenant.11.desc: "Common-hearth keepers report that some households cannot bring even a small offering to the seasonal feast. A chief's full table has become an accusation against him. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."
 ashen_covenant.11.a: "Provision the hungry households from the treasury."
 ashen_covenant.11.a_terms: "Pay 5 gold. +5% monthly food for three years. Replaces any earlier Covenant story consequences. No prestige reward."

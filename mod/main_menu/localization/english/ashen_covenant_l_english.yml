 ashen_covenant.7.title: "The Unnamed Crew"
 ashen_covenant.7.desc: "A captain has omitted missing sailors from his account of a voyage. Naming them would oblige his patrons to support their households. The Lantern-keepers have brought their families to court. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."
 ashen_covenant.7.a: "Compensate the missing sailors' households."
 ashen_covenant.7.a_terms: "Pay 5 gold. +5% monthly sailor gain for three years. Replaces any earlier Covenant story consequences. No prestige reward."

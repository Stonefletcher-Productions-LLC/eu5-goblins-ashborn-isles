 ashen_covenant.9.title: "The Captive's Hearth"
 ashen_covenant.9.desc: "An enslaved household asks to name its dead beside those of its owners. Its speaker asks whether sharing a hearth creates duties even toward captives. Several chiefs fear the precedent. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."
 ashen_covenant.9.a: "Fund the captives' memorial over the chiefs' objections."
 ashen_covenant.9.a_terms: "Pay 5 gold. +5% Oathkeeper estate target satisfaction for three years. -2.5% noble estate target satisfaction for three years. Replaces any earlier Covenant story consequences. No prestige reward."

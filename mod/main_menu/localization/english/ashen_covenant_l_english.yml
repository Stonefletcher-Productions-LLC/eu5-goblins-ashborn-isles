 ashen_covenant.20.title: "The Moot of Six Fires"
 ashen_covenant.20.desc: "The islands answer to a common realm, but their Oathkeepers speak with many voices. Ember-speakers ask who will witness the crown's promises. Tide-mothers insist that no common authority erase their household cords. The gathered custodians await a settlement: renew the local covenants, or appoint a First Oathkeeper to serve the united realm?"
 ashen_covenant.20.a: "Renew the local covenants. Each shrine keeps its witnesses."
 ashen_covenant.20.b: "Appoint a First Oathkeeper to the common realm."

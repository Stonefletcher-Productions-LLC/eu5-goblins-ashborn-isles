l_english:
 religious_influence_cm_hunger_below: "Covenant Favor"
 ac_favor_current: "Covenant Favor: [GetPlayer.GetCurrencyValue('religious_influence')|1]"
 ac_favor_explanation: "Covenant Favor is your religious influence. The Ashen Covenant grants 0.2 Favor per month and adds 100 to its maximum. Stories can raise or spend Favor. Major rites cost 20 Favor plus gold. See the Religion panel for the current gain and maximum modifiers."
 ac_common_hearth: "Feed the Common Hearth"
 ac_common_hearth_desc: "The first share sustains the households. Chiefs must answer for empty stores."
 ac_offering_smoke: "Smoke Is an Offering"
 ac_offering_smoke_desc: "Useful work feeds the fire below. Forge crews dedicate their first finished piece."
 ac_crew_home: "Bring the Crew Home"
 ac_crew_home_desc: "The Lantern Dead guide those who keep the rescue lights burning. Reckon the cargo after the living."
 ac_remembered_dead: "The Dead Keep Their Names"
 ac_remembered_dead_desc: "Funeral keepers recite the names and obligations carried by each household."
 ac_cutting_oath: "No Axe Without an Oath"
 ac_cutting_oath_desc: "Root-wardens guard seed groves, firebreaks and the wooded paths that shelter our people."
 ac_shore_spirits: "Every Shore Has Spirits"
 ac_shore_spirits_desc: "An unfamiliar shore has powers of its own. Its inhabitants may teach us how to honor them."
 ac_first_share: "The First Share Goes Below"
 ac_first_share_desc: "The Hunger receives the first offering after battle; the bereaved must also receive their due."
 ac_many_hearths: "Many Hearths, One Covenant"
 ac_many_hearths_desc: "Each shrine keeps its own witnesses. A common faith need not silence its many voices."
 ac_first_mouth: "The First Mouth"
 ac_first_mouth_desc: "A warm fissure beneath Cinder Crown. Ember-speakers listen through hollow stone tubes while forge crews surrender their first work. No one agrees whether the first goblins were born here or escaped through it."
 ac_first_mouth_site: "The First Mouth"
 ac_listening_pool: "The Listening Pool"
 ac_listening_pool_desc: "A spring-fed pool beside the tidal channels. Carved stakes record repair oaths, and old flood marks remind the marsh houses what neglect can cost."
 ac_listening_pool_site: "The Listening Pool"
 ac_lantern_steps: "The Lantern Steps"
 ac_lantern_steps_desc: "Steps descend to the landing where the drowned are brought ashore. Lamps burn beside name stones; strangers receive a stone even when no name survives."
 ac_lantern_steps_site: "The Lantern Steps"
 ac_mothers_basin: "The Mothers' Basin"
 ac_mothers_basin_desc: "Maternal households wash heirloom cords in a rain-fed basin above the harbor. Each knot recalls a dependent, a promise or a return from sea."
 ac_mothers_basin_site: "The Mothers' Basin"
 ac_storm_teeth: "The Storm Teeth"
 ac_storm_teeth_desc: "Basalt pinnacles carry ropes left by returning crews. Pilgrims climb with a stone for someone who never returned, seeking the courage of the Tooth in the Gale."
 ac_storm_teeth_site: "The Storm Teeth"
 ac_emberroot: "The Emberroot Hollow"
 ac_emberroot_desc: "A charred stump marks the first sheltered hearth. Funeral ash is laid beneath young trees, and Root-wardens keep the surrounding seed grove from the charcoal axes."
 ac_emberroot_site: "The Emberroot Hollow"
 ac_three_watchfires: "The Three Watchfires"
 ac_three_watchfires_desc: "Three fires mark the Quiet Road below Emberwatch. Passing crews leave fuel before counting their cargo, honoring the Lantern Dead and the Cindermaw households who keep the channel lit."
 ac_three_watchfires_site: "The Three Watchfires"
 ac_first_weight: "The First Weight"
 ac_first_weight_desc: "A copper weight hangs above the sea fissure beneath Chainhaven. Merchants surrender the first measured share of each cargo; false scales are broken before the Oathkeepers."
 ac_first_weight_site: "The First Weight"
 ac_last_lamp: "The Last Lamp"
 ac_last_lamp_desc: "Tolltooth households keep a lamp for crews still beyond the horizon. Its flame is tended before any toll is counted, for a lost crew can repay no debt."
 ac_last_lamp_site: "The Last Lamp"
 ac_blackwood_oathstones: "The Blackwood Oathstones"
 ac_blackwood_oathstones_desc: "Woodcutters bind charcoal-black cords around stones on the old forest path. Each cord promises a firebreak kept or a household sheltered; broken oaths are recited before the next cutting."
 ac_blackwood_oathstones_site: "The Blackwood Oathstones"
 ac_ashfield_hearth: "The Ashfield Hearth"
 ac_ashfield_hearth_desc: "Field households carry a pinch of the first grain to a low hearth built from cooling lava. Its keepers feed hungry neighbors before burning the offering. Few pilgrims come from beyond the nearby farms."
 ac_ashfield_hearth_site: "The Ashfield Hearth"
 ac_miregrove_witness: "The Miregrove Witness"
 ac_miregrove_witness_desc: "A crooked grove above the floodwater shelters the oath stakes of neighboring marsh houses. Disputes over channels are spoken before its roots, where witnesses remember promises longer than chiefs do."
 ac_miregrove_witness_site: "The Miregrove Witness"
 ac_major_rite: "Major Covenant Rite"
 MODIFIER_TYPE_NAME_ac_major_rite_cost_modifier: "Major Covenant Rite Cost"
 MODIFIER_TYPE_DESC_ac_major_rite_cost_modifier: "Changes the cost of performing a major Covenant rite."

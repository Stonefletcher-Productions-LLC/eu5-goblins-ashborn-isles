 ashen_covenant.4.title: "A Cord Without a Name"
 ashen_covenant.4.desc: "A dependent branch of the maternal house presents an unmarked cord at the Mothers' Basin. Recognizing it would make old promises public and give its households a voice at future observances. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."

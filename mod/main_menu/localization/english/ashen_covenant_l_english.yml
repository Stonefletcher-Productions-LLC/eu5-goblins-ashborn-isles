 MODIFIER_TYPE_NAME_ac_minor_rite_cost_modifier: "Covenant Rite Cost"
 MODIFIER_TYPE_DESC_ac_minor_rite_cost_modifier: "Changes the cost of performing a Covenant rite."
 ac_clan_rite: "Clan Rite"
 MODIFIER_TYPE_NAME_ac_clan_rite_cost_modifier: "Clan Rite Cost"
 MODIFIER_TYPE_DESC_ac_clan_rite_cost_modifier: "Changes the cost of performing a clan or Moot rite."
 ac_moot_convening: "Convening the Moot"
 MODIFIER_TYPE_NAME_ac_moot_convening_cost_modifier: "Convening the Moot Cost"
 MODIFIER_TYPE_DESC_ac_moot_convening_cost_modifier: "Changes the cost of performing the Moot of Six Fires."
 ac_returning_ash: "Feast of Returning Ash"
 ac_returning_ash_desc: "Fund a communal feast and name the dead. Costs two months of scaled income and 20 Covenant Favor. The blessing lasts five years; all major rites share a five-year cooldown."
 STATIC_MODIFIER_NAME_ac_returning_ash: "Feast of Returning Ash"
 STATIC_MODIFIER_DESC_ac_returning_ash: "Fund a communal feast and name the dead. The blessing lasts five years."
 ac_water_lanterns: "Lanterns Upon the Water"
 ac_water_lanterns_desc: "Provision beacon keepers and the households of missing crews. Costs two months of scaled income and 20 Covenant Favor. The blessing lasts five years; all major rites share a five-year cooldown."
 STATIC_MODIFIER_NAME_ac_water_lanterns: "Lanterns Upon the Water"
 STATIC_MODIFIER_DESC_ac_water_lanterns: "Provision beacon keepers and the households of missing crews. The blessing lasts five years."
 ac_first_oath: "Renewal of the First Oath"
 ac_first_oath_desc: "Reconcile the crown with the Oathkeepers and renew communal duties. Costs two months of scaled income and 20 Covenant Favor. The blessing lasts five years; all major rites share a five-year cooldown."
 STATIC_MODIFIER_NAME_ac_first_oath: "Renewal of the First Oath"
 STATIC_MODIFIER_DESC_ac_first_oath: "Reconcile the crown with the Oathkeepers and renew communal duties. The blessing lasts five years."
 ac_feed_mouth: "Feed the Mouth"
 ac_feed_mouth_desc: "Carry a month of the crown's income to the nearest fissure shrine. The Oathkeepers count the offering aloud. Can be performed again after 2 years."
 ac_witness_oath: "Witness an Oath"
 ac_witness_oath_desc: "Oathkeepers hear the chiefs swear their duties to the crown and to their households. Can be performed again after 1 year."
 ac_name_dead: "Name the Dead"
 ac_name_dead_desc: "Recite the names of the fallen before the muster, so that no household is forgotten in the reckoning. The blessing lasts 2 years. Can be performed again after 2 years."
 STATIC_MODIFIER_NAME_ac_name_dead: "Name the Dead"
 STATIC_MODIFIER_DESC_ac_name_dead: "Recite the names of the fallen before the muster, so that no household is forgotten in the reckoning."
 ac_bless_hulls: "Bless the Hulls"
 ac_bless_hulls_desc: "Smoke every keel in the harbor and hang a lantern for each crew still at sea. The blessing lasts 3 years. Can be performed again after 3 years."
 STATIC_MODIFIER_NAME_ac_bless_hulls: "Bless the Hulls"
 STATIC_MODIFIER_DESC_ac_bless_hulls: "Smoke every keel in the harbor and hang a lantern for each crew still at sea."
 ac_clan_cindermaw: "Smoke from the First Mouth"
 ac_clan_cindermaw_desc: "Ember-speakers carry coals from the First Mouth to every new foundation. Cinderkin work goes faster under that smoke. The blessing lasts 3 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_clan_cindermaw: "Smoke from the First Mouth"
 STATIC_MODIFIER_DESC_ac_clan_cindermaw: "Ember-speakers carry coals from the First Mouth to every new foundation. Cinderkin work goes faster under that smoke."
 ac_clan_brackmaw: "Listening at the Pool"
 ac_clan_brackmaw_desc: "Reed-witnesses read the Listening Pool and bless the marsh households that will raise the next generation. The blessing lasts 3 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_clan_brackmaw: "Listening at the Pool"
 STATIC_MODIFIER_DESC_ac_clan_brackmaw: "Reed-witnesses read the Listening Pool and bless the marsh households that will raise the next generation."
 ac_clan_reefhook: "Lantern for the Lost"
 ac_clan_reefhook_desc: "Reefkin light the Lantern Steps for crews that never returned. Their kin answer by signing onto the next voyage. The blessing lasts 3 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_clan_reefhook: "Lantern for the Lost"
 STATIC_MODIFIER_DESC_ac_clan_reefhook: "Reefkin light the Lantern Steps for crews that never returned. Their kin answer by signing onto the next voyage."
 ac_clan_shatterfin: "The Tidemothers' Cord"
 ac_clan_shatterfin_desc: "Tidemothers tie a new knot at the Mothers' Basin for every household bound to us abroad. Foreign courts learn that a Shatterkin cord is not cut lightly. The blessing lasts 3 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_clan_shatterfin: "The Tidemothers' Cord"
 STATIC_MODIFIER_DESC_ac_clan_shatterfin: "Tidemothers tie a new knot at the Mothers' Basin for every household bound to us abroad. Foreign courts learn that a Shatterkin cord is not cut lightly."
 ac_clan_sootwake: "Oath of the Axe"
 ac_clan_sootwake_desc: "Root-wardens let each young Sootkin swear by Emberroot Hollow before taking up an axe for the crown. The blessing lasts 3 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_clan_sootwake: "Oath of the Axe"
 STATIC_MODIFIER_DESC_ac_clan_sootwake: "Root-wardens let each young Sootkin swear by Emberroot Hollow before taking up an axe for the crown."
 ac_clan_giltfang: "Weighing of the First Gold"
 ac_clan_giltfang_desc: "Merchants hang their scales beside the First Weight and swear them true. Giltkin traders are trusted where their oath is known. The blessing lasts 3 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_clan_giltfang: "Weighing of the First Gold"
 STATIC_MODIFIER_DESC_ac_clan_giltfang: "Merchants hang their scales beside the First Weight and swear them true. Giltkin traders are trusted where their oath is known."
 ac_convene_moot: "Convene the Moot of Six Fires"
 ac_convene_moot_desc: "Call the Oathkeepers of every island to the six fires. Disputes between chiefs are heard and settled before the crown. Can be performed again after 5 years."
 ac_hear_shrines: "Hear the Local Shrines"
 ac_hear_shrines_desc: "Under the Local Covenants each shrine keeps its own witnesses. The crown travels to hear them in turn. The blessing lasts 5 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_hear_shrines: "Hear the Local Shrines"
 STATIC_MODIFIER_DESC_ac_hear_shrines: "Under the Local Covenants each shrine keeps its own witnesses. The crown travels to hear them in turn."
 ac_oathkeeper_writ: "The First Oathkeeper's Writ"
 ac_oathkeeper_writ_desc: "The First Oathkeeper sends sealed writs to every island. Chiefs who ignore them answer to the Moot. The blessing lasts 5 years. Can be performed again after 5 years."
 STATIC_MODIFIER_NAME_ac_oathkeeper_writ: "The First Oathkeeper's Writ"
 STATIC_MODIFIER_DESC_ac_oathkeeper_writ: "The First Oathkeeper sends sealed writs to every island. Chiefs who ignore them answer to the Moot."

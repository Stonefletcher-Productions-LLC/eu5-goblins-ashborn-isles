 ashen_covenant.12.title: "The First Finished Blade"
 ashen_covenant.12.desc: "Forge crews disagree over an unusually fine blade set aside for the First Mouth. A captain wants it for the muster; the smith who made it insists that an offering is an oath already spoken. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."
 ashen_covenant.12.a: "Pay the smith and honor the offering."
 ashen_covenant.12.a_terms: "Pay 5 gold. +5 Covenant Favor immediately. Replaces any earlier Covenant story consequences. No prestige reward."
 ashen_covenant.12.b: "Send the blade to the muster despite the oath."

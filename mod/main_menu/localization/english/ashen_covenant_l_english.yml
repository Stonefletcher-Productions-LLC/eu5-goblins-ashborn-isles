 ashen_covenant.8.title: "The Hungry Preacher"
 ashen_covenant.8.desc: "A wandering speaker claims that charcoal and food no longer satisfy the Hunger Below. The local Oathkeepers accuse the preacher of making the mountain an excuse for ambition. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."
 ashen_covenant.8.a: "Sponsor a public feast under the Oathkeepers."
 ashen_covenant.8.a_terms: "Pay 5 gold. +5% Oathkeeper estate target satisfaction for three years. Replaces any earlier Covenant story consequences. No prestige reward."

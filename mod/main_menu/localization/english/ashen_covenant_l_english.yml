 ashen_covenant.6.title: "The Forbidden Felling"
 ashen_covenant.6.desc: "Charcoal burners have marked trees inside Emberroot Hollow. The navy needs timber and the forges need fuel, but Root-wardens insist that a seed grove cannot be bought back once it is gone. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."

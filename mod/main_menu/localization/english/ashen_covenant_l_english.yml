 ashen_covenant.3.title: "A Stranger Beneath Our Lantern"
 ashen_covenant.3.desc: "A foreign sailor has washed ashore at the Lantern Steps. Some households refuse a stranger a place among their dead; the keepers answer that the sea did not ask his birthplace. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."

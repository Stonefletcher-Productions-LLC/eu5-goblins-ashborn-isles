 ashen_covenant.5.title: "The Path to the Storm Teeth"
 ashen_covenant.5.desc: "Loose stone has made the pilgrimage climb dangerous. Returning captains demand a repaired path, while younger crews call the danger a fitting test of the storm spirit. Each approach has its own cost and consequences, shown on the choices. Temporary effects last three years. Deferring makes no resource or modifier change; the normal three-year story cooldown still applies."

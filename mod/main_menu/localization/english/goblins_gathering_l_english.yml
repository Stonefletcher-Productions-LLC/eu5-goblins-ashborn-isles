 ga_compact_autonomy: "Autonomy Charter"
 ga_compact_autonomy_desc: "Half the normal base vassal tribute; no annexation for 20 years, then half normal integration speed. The ruling house and succession customs remain. Normal vassal military obligations apply."
 ga_compact_protection: "Protection Charter"
 ga_compact_protection_desc: "Normal vassal tribute and integration rules; exemption from offensive wars, protection against external attackers and fellow subjects, and +10% defensiveness. The protector takes -5% army maintenance efficiency while this charter lasts. The ruling house and succession customs remain."
 ga_compact_autonomy_tribute: "Autonomy Charter Tribute"
 MODIFIER_TYPE_NAME_ga_compact_autonomy_tribute_cost_modifier: "Autonomy Charter Tribute Cost"
 MODIFIER_TYPE_DESC_ga_compact_autonomy_tribute_cost_modifier: "Changes the tribute paid under an Autonomy Charter."
 ga_horde_tribute: "Send Tribute to the Warchief"
 ga_horde_tribute_desc: "Send 10 gold to the Warchief of the Goblin Horde. The Warchief gains +25 opinion of us for ten years. Once every five years."
 ga_horde_war_horns: "Sound the War Horns"
 ga_horde_war_horns_desc: "Warchief only. Spend 25 gold to rouse every crown of the Horde: +5% land morale for all members for two years. Once every ten years."
 goblin_horde: "Goblin Horde"
 goblin_horde_desc: "Every goblin crown of the Ashborn Isles belongs to the Horde. Its crowns raid, rival and conquer one another freely, but when an outsider declares war on any of them, the whole Horde answers. The crown holding most of the homeland leads as Warchief."
 GOBLIN_HORDE_LEADER: "Warchief"
 GOBLIN_HORDE_KIN: "Goblin kin"
 goblin_horde_defense_tt: "The attacker is not a member of the Goblin Horde. Wars between goblin crowns do not call the Horde."
 ga_gathering_header: "Six Crowns - One Realm"
 ga_gathering_race: "The Race for the Isles"
 ga_gathering_realm_count: "[Country.MakeScope.ScriptValue('ga_gathering_realm_locations')|0] / 117"
 ga_gathering_progress_tt: "Homeland locations within this independent crown's realm. Counts direct ownership, vassals, Compact charters and junior union partners, including eligible nested vassals. Alliances, tributaries and foreign conquests do not contribute. Updates from current ownership; occupation alone does not count."
 ga_gathering_annexed: "Annexed"
 ga_gathering_annexed_tt: "This founding crown no longer exists. Its former homeland now contributes according to current ownership. A restored kingdom will reappear here automatically."
 ga_gathering_standings: "Founding crowns - Homeland locations in each realm"
 ga_gathering_vassal: "Vassal crown"
 ga_gathering_junior: "Junior crown"
 ga_gathering_subject: "Subject crown"
 ga_gathering_dependent_tt: "This crown cannot claim unification while dependent. Its homeland locations contribute to its senior crown only where the vassal or union chain satisfies the unification rules."
 ga_gathering_other_subject_tt: "This crown cannot claim unification while dependent. Tributary ties do not add its homeland to an overlord's unification progress."
 ga_gathering_rules: "The Path to One Crown"
 ga_gathering_paths: "#bold Conquest#! - own the homeland directly.\n#bold Pacts#! - climb the pact ladder: Bargain, Sworn Pact, then a Compact charter that makes a crown your subject.\n#bold Submission#! - bring kingdoms into your realm as vassals by war.\n#bold Union#! - lead junior union partners.\nAlliances and Sworn Pacts build trust, but only subjects and unions unite the Isles."
 ga_pact_step_strangers: "Our pact: #Y Strangers#!"
 ga_pact_step_strangers_tt: "No alliance and no completed Harbor Bargain yet. Form an alliance through normal diplomacy, or complete a five-year Harbor Bargain, to start the pact ladder."
 ga_pact_step_trusted: "Our pact: #Y Trusted#!"
 ga_pact_step_trusted_tt: "An alliance or a completed Harbor Bargain links our crowns. Next: once both crowns hold 50+ opinion of each other, use #Y Swear a Sworn Pact#! in this situation."
 ga_pact_step_sworn: "Our pact: #Y Sworn Pact#!"
 ga_pact_step_sworn_tt: "Our crowns are bound by oath. Next: when they hold 100+ opinion of us and their rank is no higher than ours, use #Y Open Compact Talks#!. Relative strength is not checked between sworn crowns."
 ga_pact_step_bound: "Our pact: #Y Bound to us#!"
 ga_pact_step_bound_tt: "This crown is our subject. Its homeland locations count toward our unification."
 ga_ui_independent_tt: "This crown is an independent Ashborn kingdom (not a subject or junior union partner)."
 ga_ui_peace_tt: "This crown is at peace."
 ga_ui_compact_free_tt: "This crown has no pending Compact talks. Finish or close the existing invitation; it expires 180 days after it was sent."
 ga_ui_harbor_free_tt: "This crown has no pending Harbor Bargain negotiation. Resolve it first, or wait for its 180-day expiry."
 ga_ui_legacy_free_tt: "This crown has no unresolved offer from the earlier diplomacy system. Close that saved offer first."
 ga_ui_quiet_tt: "This crown has completed its two-year quiet period after a Compact approach or live refusal."
 ga_ui_pair_wait_tt: "These two crowns have completed their five-year wait after the last Compact approach or live refusal."
 ga_ui_friendly_tt: "This crown does not regard the other crown as a rival or enemy."
 ga_ui_allied_tt: "An alliance currently exists with the other crown. Form one through ordinary diplomacy."
 ga_ui_bargain_tt: "This crown has recorded a completed five-year Harbor Bargain with this specific partner. A signed or unfinished bargain is not enough; older, untracked contracts earn no retroactive credit."
 ga_ui_alliance_age_tt: "This crown has recorded three years of alliance with this specific partner. The monthly check must observe the full term; an observed break resets it. This can overlap the five-year bargain."
 ga_ui_opinion_tt: "The prospective subject has at least 100 opinion of the patron."
 ga_ui_strength_tt: "The two crowns have sworn a pact, or the prospective subject has no more than 65% of the patron's strength."
 ga_ui_bound_tt: "The two crowns are bound by a Sworn Pact, or have both completed a five-year Harbor Bargain together and kept an alliance for three observed years."
 ga_ui_pact_free_tt: "This crown has no pending Sworn Pact offer. It expires 180 days after it was sent."
 ga_ui_pact_opinion_tt: "This crown has at least 50 opinion of the other crown."
 ga_ui_pact_foundation_tt: "The two crowns are allied, or have completed a five-year Harbor Bargain together."
 ga_ui_not_sworn_tt: "These crowns have not already sworn a pact."
 ga_ui_rank_tt: "The prospective subject has no higher country rank than the patron."
 ga_ui_no_crown: "@trigger_no! No eligible crown. Inspect the listed crowns for unmet requirements. Annexed crowns and your own crown are not listed."
 ga_ui_homeland_progress: "Your qualifying realm: [GetPlayer.MakeScope.ScriptValue('ga_ui_homeland_count')|0] / 117 homeland locations"
 ga_ui_homeland_rules: "Unification requires every homeland location, not just the six capitals. Direct ownership, qualifying vassals, Compact charters and junior union partners count. Allies, tributaries, occupation and foreign land do not. A dependent crown cannot claim unification; its count is shown as zero."
 ga_ui_compact_heading: "#bold The Pact Ladder#! - Bargain, Sworn Pact, Compact"
 ga_ui_compact_route: "#Y 1. Trust#! - ally a crown, or complete a five-year Harbor Bargain with it.\n#Y 2. Swear#! - with 50+ opinion both ways, use Swear a Sworn Pact.\n#Y 3. Bind#! - when the sworn crown holds 100+ opinion of you and no higher rank, use Open Compact Talks. It becomes your subject under a charter and its homeland counts toward unification.\nEach crown below shows your current step with it. Inspect a crown in any action to see which checks are still unmet."
 ga_ui_history_note: "History updates monthly. Existing saves start alliance observation with this update; only newly tracked bargains earn completion credit. A missing check means the full requirement has not yet been recorded, not that progress is lost. An observed alliance break resets its three-year term."
 ga_ui_eastern_route: "Keep the homeland united under the same realm rules. For the Eastern Hunger, secure a genuinely foreign European coastal location through normal play. The Ashborn homeland itself never counts as that foothold."

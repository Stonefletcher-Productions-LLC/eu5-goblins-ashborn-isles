l_english:
 ga_offer_harbor_pact: "Seek Provisions for Our Harbors"
 ga_offer_harbor_pact_desc: "Step 1 of 3 on the road to one crown: Bargain, Sworn Pact, Compact.\nBuy provisions from an independent Ashborn crown.\nPrice: 10 gold, paid only when signed. Duration: 5 years.\nYou gain: +10% province food storage limit.\nSupplier commits: 5% of its province food storage limit.\nOne counteroffer: the other service for 15 gold.\n\nRequires: mutual opinion of 25+ and a free contract slot.\nA completed five-year bargain lets the pair swear a Sworn Pact.\nOne contract per crown; no alliance or vassalage.\nTalks expire in 180 days. Crown cooldown: 2 years.\nThe same pair must wait 5 years between approaches.\nWar, rivalry or a vanished partner ends the contract at the next\nmonthly check. No refund.\nInspect storage in the province food stockpile tooltip."
 ga_seek_pilot_bargain: "Seek Pilots for Our Harbors"
 ga_seek_pilot_bargain_desc: "Step 1 of 3 on the road to one crown: Bargain, Sworn Pact, Compact.\nBuy pilots from an independent Ashborn crown.\nPrice: 10 gold, paid only when signed. Duration: 5 years.\nYou gain: +5% naval morale recovery.\nSupplier commits: 2.5% of its naval morale recovery.\nOne counteroffer: the other service for 15 gold.\n\nRequires: mutual opinion of 25+ and a free contract slot.\nA completed five-year bargain lets the pair swear a Sworn Pact.\nOne contract per crown; no alliance or vassalage.\nTalks expire in 180 days. Crown cooldown: 2 years.\nThe same pair must wait 5 years between approaches.\nWar, rivalry or a vanished partner ends the contract at the next\nmonthly check. No refund."
 ga_send_supplies: "Send Grain and Iron"
 ga_send_supplies_desc: "Pay 10 gold to send supplies to another independent Ashborn kingdom.\nThe recipient gains 10 gold and improved opinion of you for five\nyears."
 ga_swear_pact: "Swear a Sworn Pact"
 ga_swear_pact_desc: "Step 2 of 3 on the road to one crown.\nBind another independent Ashborn crown by oath. No gold, no\nsubjects.\n\nRequires: an alliance or a completed Harbor Bargain with them, and\n50+ opinion both ways.\nBoth crowns gain +40 opinion of each other for ten years.\n\nA Sworn Pact eases Compact talks: no strength check, and either\ncrown can later open talks without an alliance. War or rivalry\nbetween the two crowns breaks the pact. Offers expire after 180\ndays."
 ga_offer_compact: "Open Compact Talks"
 ga_offer_compact_desc: "Step 3 of 3 on the road to one crown.\nInvite a sworn or long-allied crown to become your subject under a\ncharter.\n\nRequires one of:\n- a Sworn Pact between the two crowns, or\n- a completed Harbor Bargain plus three observed years of alliance.\nThe smaller crown needs 100+ opinion of you and no higher rank.\nWithout a Sworn Pact it must also have at most 65% of your strength.\n\nIt chooses autonomy or protection terms, you accept or refuse, and\nit ratifies or withdraws. No fee. Talks expire after 180 days, with\na two-year quiet period and a five-year wait for the same pair."
 ga_challenge_crown: "Challenge a Rival Crown"
 ga_challenge_crown_desc: "Gain a five-year native subjugation casus belli against an\nindependent goblin rival. You must declare and win a normal war;\nthis action grants no subjects."
 ga_claim_homeland: "Claim a Rival Harbor"
 ga_claim_homeland_desc: "Gain a five-year native province conquest casus belli for a rival\ngoblin capital province. Normal declarations, peace costs and\nterritorial transfers apply."
 ga_prepare_crossing: "Prepare the Eastern Crossing"
 ga_prepare_crossing_desc: "Pay 20 gold for five years of 15% lower transport construction cost\nand 5% higher naval morale. Ships, armies and land must still be\nobtained through normal gameplay. Available once every ten years."
 ga_plan_eastern_foothold: "Plan an Eastern Foothold"
 ga_plan_eastern_foothold_desc: "Pay 10 gold and select a discovered European coastal province. Gain\na five-year conquest casus belli against its current owner.\nSelecting another province replaces the permitted eastern objective.\nNo war is declared and no land is granted."

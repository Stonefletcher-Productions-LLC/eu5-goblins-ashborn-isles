 ga_oath_honored: "The Ashen Oath"
 ga_hb_contract_free_tt: "No active Harbor Bargain. Each crown may hold #Y one contract#! for #Y five years#!."
 ga_hb_quiet_tt: "The #Y two-year#! waiting period since our last harbor approach has ended."
 STATIC_MODIFIER_NAME_ga_hb_provisions_received: "Provisions Purchased"
 STATIC_MODIFIER_DESC_ga_hb_provisions_received: "Purchased provisions increase province food storage limit by 10% for five years.\n\n$ga_province_food_storage_tt$"
 STATIC_MODIFIER_NAME_ga_hb_provisions_supplied: "Provisions Committed"
 STATIC_MODIFIER_DESC_ga_hb_provisions_supplied: "Committed provisions reduce our province food storage limit by 5% for five years. We received payment when the bargain was signed.\n\n$ga_province_food_storage_tt$"
 STATIC_MODIFIER_NAME_ga_hb_pilots_received: "Pilots Purchased"
 STATIC_MODIFIER_DESC_ga_hb_pilots_received: "Purchased pilots increase naval morale recovery by 5% for five years."
 STATIC_MODIFIER_NAME_ga_hb_pilots_supplied: "Pilots Committed"
 STATIC_MODIFIER_DESC_ga_hb_pilots_supplied: "Committed pilots reduce our naval morale recovery by 2.5% for five years. We received payment when the bargain was signed."
 ga_early_project_available_tt: "Requires #Y 25 gold#! and an unresolved clan project."
 ga_province_food_storage_tt: "Changes the #Y maximum food stored in each province#!.\nIt does not add food or increase monthly food production.\n#bold Where to see it#!: select one of your locations, then\nhover the province food display. Hover the #Y stockpile total#!\ninside that tooltip to see the limit and its modifier breakdown."
 ga_early_project_exclusive_tt: "Only #Y one#! project can be funded. The other projects will be declined."
 ga_early_project_decline_tt: "Keep your gold. All three projects are declined #Y permanently#!.\nNo project modifier is gained."
 STATIC_MODIFIER_NAME_ga_giltfang_honest_weights: "Honest Weights"
 STATIC_MODIFIER_DESC_ga_giltfang_honest_weights: "Standard measures improve production efficiency by 5% for five years."
 STATIC_MODIFIER_NAME_ga_giltfang_harbor_envoys: "Accounts Between Crowns"
 STATIC_MODIFIER_DESC_ga_giltfang_harbor_envoys: "Harbor envoys improve diplomatic reputation by 0.5 for five years."
 STATIC_MODIFIER_NAME_ga_giltfang_harbor_watch: "Watch of Chainhaven"
 STATIC_MODIFIER_DESC_ga_giltfang_harbor_watch: "Supplied harbor watches improve fort defense by 10% for five years."
 STATIC_MODIFIER_NAME_ga_cindermaw_funded_accounts: "Grakka's Funded Audit"
 STATIC_MODIFIER_DESC_ga_cindermaw_funded_accounts: "Funded muster accounts improve army maintenance efficiency by 5% for five years."
 STATIC_MODIFIER_NAME_ga_shatterfin_crew_households: "Households of the Returning Tide"
 STATIC_MODIFIER_DESC_ga_shatterfin_crew_households: "Support for crew households increases monthly sailor gain by 5% for five years."
 STATIC_MODIFIER_NAME_ga_sootwake_woodland_wardens: "Wardens of the Blackbough"
 STATIC_MODIFIER_DESC_ga_sootwake_woodland_wardens: "Equipped wardens and prepared approaches increase fort defense by 10% for five years."
 STATIC_MODIFIER_NAME_ga_brackmaw_marsh_workshops: "Tools for the Marsh Houses"
 STATIC_MODIFIER_DESC_ga_brackmaw_marsh_workshops: "Equipped workshops increase production efficiency by 5% for five years."
 STATIC_MODIFIER_NAME_ga_brackmaw_causeway_defenses: "Guarded Causeways"
 STATIC_MODIFIER_DESC_ga_brackmaw_causeway_defenses: "Prepared causeway defenses increase fort defense by 10% for five years."
 STATIC_MODIFIER_NAME_ga_reefhook_repair_yards: "Ordered Repair Yards"
 STATIC_MODIFIER_DESC_ga_reefhook_repair_yards: "Organized repair yards increase navy maintenance efficiency by 5% for five years."
 STATIC_MODIFIER_NAME_ga_reefhook_pilot_envoys: "Pilots at Foreign Tables"
 STATIC_MODIFIER_DESC_ga_reefhook_pilot_envoys: "Pilot envoys increase diplomatic reputation by 0.5 for five years."
 STATIC_MODIFIER_NAME_ga_shatterfin_storm_crews: "Crews of the Stormfang"
 STATIC_MODIFIER_DESC_ga_shatterfin_storm_crews: "Crew drills increase naval morale by 5% for five years."
 STATIC_MODIFIER_NAME_ga_shatterfin_house_delegates: "A Voice for the Maternal House"
 STATIC_MODIFIER_DESC_ga_shatterfin_house_delegates: "House delegates increase diplomatic reputation by 0.5 for five years."
 STATIC_MODIFIER_NAME_ga_sootwake_charcoal_workshops: "Work Through the Winter"
 STATIC_MODIFIER_DESC_ga_sootwake_charcoal_workshops: "Supported workshops increase production efficiency by 5% for five years."
 STATIC_MODIFIER_NAME_ga_sootwake_sheltered_stores: "Stores Beneath the Boughs"
 STATIC_MODIFIER_DESC_ga_sootwake_sheltered_stores: "Sheltered stores increase province food storage limit by 10% for five years.\n\n$ga_province_food_storage_tt$"
 STATIC_MODIFIER_NAME_ga_kin_rally: "Ashen Kinship"
 STATIC_MODIFIER_DESC_ga_kin_rally: "The goblin crowns stand together against an outside invader. Our troops fight harder against those outside our faith, and our fortifications hold longer."
 ga_kin_answered: "Answered Our Call"
 STATIC_MODIFIER_NAME_ga_horde_war_horns: "Horde War Horns"
 STATIC_MODIFIER_DESC_ga_horde_war_horns: "The Warchief has sounded the war horns across the Ashborn Isles."
 STATIC_MODIFIER_NAME_ga_gathering_claimant: "Claimant Among the Six"
 STATIC_MODIFIER_DESC_ga_gathering_claimant: "Our envoys speak at every harbor hearth as if the Isles already had one crown, and it was ours."
 STATIC_MODIFIER_NAME_ga_gathering_defiant: "Our Shores, Our Crown"
 STATIC_MODIFIER_DESC_ga_gathering_defiant: "Our crews patrol our own waters and answer every summons from the other crowns with a closed harbor."
 STATIC_MODIFIER_NAME_ga_compact_guarantees: "Guarantees of the Ashen Compact"
 STATIC_MODIFIER_DESC_ga_compact_guarantees: "Sealed charters bind the lesser crowns to us, and each seal is a promise we are expected to keep."
 STATIC_MODIFIER_NAME_ga_unification_recovery: "Six Crowns, One Hunger"
 STATIC_MODIFIER_DESC_ga_unification_recovery: "The Isles answer to one authority for the first time. Old feuds are buried, though not very deep."
 STATIC_MODIFIER_NAME_ga_crossing_preparations: "The Eastern Crossing"
 STATIC_MODIFIER_DESC_ga_crossing_preparations: "Shipwrights lay down transports and the crews drill for a long crossing toward the mainland."
 STATIC_MODIFIER_NAME_ga_first_eastern_harbor: "The First Eastern Harbor"
 STATIC_MODIFIER_DESC_ga_first_eastern_harbor: "Goblin crews walk a foreign quay that answers to our crown. Every captain wants the next one."
 STATIC_MODIFIER_NAME_ga_gathering_leadership: "Lead the Six"
 STATIC_MODIFIER_DESC_ga_gathering_leadership: "Our captains prepare to lead the Ashborn. Army morale increases by 5% for five years."
 STATIC_MODIFIER_NAME_ga_gathering_cooperation: "Stand Together"
 STATIC_MODIFIER_DESC_ga_gathering_cooperation: "Our envoys seek partners among the crowns. Diplomatic reputation increases by 0.5 for five years."
 STATIC_MODIFIER_NAME_ga_gathering_independence: "Guard Our Shores"
 STATIC_MODIFIER_DESC_ga_gathering_independence: "Our households prepare to defend their independence. Defensiveness increases by 10% for five years."
 STATIC_MODIFIER_NAME_ga_cindermaw_drilled_captains: "One Fire, Many Blades"
 STATIC_MODIFIER_DESC_ga_cindermaw_drilled_captains: "Grask drills the rival captains to hold their companies together beneath Cindermaw banners."
 STATIC_MODIFIER_NAME_ga_cindermaw_court_envoys: "A Place at the Forge"
 STATIC_MODIFIER_DESC_ga_cindermaw_court_envoys: "Kragga carries offers of patronage and protection to the other Ashborn courts."
 STATIC_MODIFIER_NAME_ga_cindermaw_counted_stores: "Grakka's Muster Accounts"
 STATIC_MODIFIER_DESC_ga_cindermaw_counted_stores: "Grakka counts stores and wages before the captains promise another campaign."
 STATIC_MODIFIER_NAME_ga_brackmaw_repaired_sluices: "Dry Granaries, Sound Gates"
 STATIC_MODIFIER_DESC_ga_brackmaw_repaired_sluices: "Repaired tidal gates protect the granaries. Province food storage limit increases by 10% for five years.\n\n$ga_province_food_storage_tt$"
 STATIC_MODIFIER_NAME_ga_reefhook_restored_beacons: "Lights Along the Shoals"
 STATIC_MODIFIER_DESC_ga_reefhook_restored_beacons: "Restored rescue beacons give returning crews confidence. Naval morale recovery increases by 5% for five years."
 ga_cb_eastern_foothold: "Eastern Foothold"
 ga_cb_eastern_foothold_desc: "Secure the selected coastal province through a normal conquest war. No territory is awarded by the event chain."
 ga_gathering.1.a: "Our crown shall lead them."
 ga_gathering.1.b: "Find those worth standing beside."
 ga_gathering.1.c: "Our shores answer to us alone."
 ga_gathering.1.title: "A Seat Among the Six"
 ga_gathering.1.desc: "The mountains have shaken and the six crowns send their captains to the gathering. They come armed, and they sit as far apart as the hall allows. The Hunger Below binds us, but no crown commands all our shores, and every crown means to be the one that does. Shall we claim leadership, seek partners, or guard our independence?\n\nThe Gathering of the Six situation tracks the race. Crowns may be conquered, or bound peacefully by climbing the pact ladder: a Harbor Bargain, then a Sworn Pact, then a Compact charter. Whatever blood lies between the crowns, an outsider who attacks one of them faces the whole Goblin Horde. Every homeland location must fall under one authority before the eastward ambition begins."
 ga_gathering.2.b: "Return the fee and close the old offer."
 ga_gathering.2.title: "An Earlier Harbor Offer"
 ga_gathering.2.desc: "This offer predates the new Harbor Bargains. It cannot create an alliance. Close it to return the old five-gold offer fee to its sender; new talks use the situation actions."
 ga_gathering.3.b: "Return the fee and close the old offer."
 ga_gathering.3.title: "An Earlier Compact Offer"
 ga_gathering.3.desc: "This offer predates charter negotiations. Close it to return the ten-gold fee to its sender. It cannot create a subject; new Compact talks require proven cooperation and two seals."
 ga_gathering.4.a: "Honor the oath."
 ga_gathering.4.title: "An Oath Accepted"
 ga_gathering.4.desc: "[SCOPE.sCountry('ga_offer_respondent').GetName] has accepted our protection under the Compact. Its dynasty and customs endure beneath our authority. Remaining independent kingdoms may still resist; the gathering ends only when every homeland location is held by us, our vassals, or our junior union partners."
 ga_gathering.16.a: "The answer is received."
 ga_gathering.16.title: "Harbor Pact Accepted"
 ga_gathering.16.desc: "[SCOPE.sCountry('ga_offer_respondent').GetName] has accepted our Harbor Pact. Our kingdoms are now allied, with the usual obligations of an alliance."
 ga_gathering.17.a: "The answer is received."
 ga_gathering.17.title: "Harbor Pact Refused"
 ga_gathering.17.desc: "[SCOPE.sCountry('ga_offer_respondent').GetName] has declined our Harbor Pact. No alliance has been formed."
 ga_gathering.18.a: "The answer is received."
 ga_gathering.18.title: "Ashen Compact Refused"
 ga_gathering.18.desc: "[SCOPE.sCountry('ga_offer_respondent').GetName] has declined our offer to join the Ashen Compact. Its crown remains independent."
 ga_gathering.5.a: "Let the captains look east."
 ga_gathering.5.title: "Six Crowns, One Hunger"
 ga_gathering.5.desc: "Every shore of the Ashborn homeland now answers to one authority. Some crowns fell to our blades; others endure beneath our seal, bound by oaths their grandchildren will argue about. The six fires burn in one hall tonight, and for once no one is counting the knives. Beyond the smoke, the eastern coasts await."
 ga_eastern_horizon_acknowledge_tt: "Acknowledge the start of The Eastern Hunger. This option has no immediate cost or reward.\n\nNext steps: use Ashborn Voyages to chart the European coast. In The Eastern Hunger situation, Prepare the Eastern Crossing buys a temporary fleet-preparation bonus, and Plan an Eastern Foothold buys a temporary casus belli for an eligible coastal province. These are separate paid actions.\n\nYour goal is to secure a European coastal foothold while keeping the Ashborn homeland united. You must obtain ships, troops and territory through normal gameplay; this event does not provide them or declare war."
 ga_gathering.6.a: "Charts, provisions, then a harbor."
 ga_gathering.6.title: "Beyond the Ashen Horizon"
 ga_gathering.6.desc: "The homeland is united, and the captains have stopped fighting each other long enough to look east. The mainland is rich, crowded and sure that we are monsters. Our voyages must chart its coast before any fleet can find a landing. Then we need ships, crews and a harbor worth taking. No one will give it to us."
 ga_gathering.7.a: "Our house endures."
 ga_gathering.7.title: "One Hunger Beyond the Isles"
 ga_gathering.7.desc: "The island struggle is settled, and not in our favor, but our crown still stands and our house keeps its customs. When the great fleet sails east, our crews will sail with it. Some of our captains grumble. Others have already started asking what a foreign harbor might be worth."
 ga_gathering.8.a: "The eastern horizon is open."
 ga_gathering.8.title: "The First Eastern Harbor"
 ga_gathering.8.desc: "Goblin banners fly over a mainland harbor. Its people bolt their doors at night and haggle with our quartermasters by day. Back home, every hearth tells the story, and every captain swears the next harbor will be his. The Hunger Below has tasted the world beyond the Isles."
 ga_gathering.10.a: "Fund Grask."
 ga_gathering.10.b: "Fund Kragga."
 ga_gathering.10.c: "Fund Grakka."
 ga_gathering.10.d: "Our other commitments come first."
 ga_gathering.10.title: "One Fire, Many Blades"
 ga_gathering.10.desc: "Drogg lays his old volcanic arrow on the council table. Around it lie petitions from the other crowns and accounts from Hooktooth's forges. Grask wants the captains drilling together before the next muster. Kragga would send envoys bearing gifts and offers of protection. Grakka taps the accounts: even a victorious army must be fed and paid. Each asks for the crown's backing. For now, Drogg must decide which claim deserves the forge's fire."
 ga_gathering.11.a: "Our other commitments come first."
 ga_gathering.11.b: "Repair the granary sluices."
 ga_gathering.11.c: "Equip the marsh workshops."
 ga_gathering.11.d: "Prepare the causeway defenses."
 ga_gathering.11.title: "The Sluice-King's Bargain"
 ga_gathering.11.desc: "Murgash earned the name Sluice-King when he sacrificed his own hall's embankment to save Brackhaven's granaries. Now the marsh houses bring their notched tide-staves to court: timber owed, fish salted, gates repaired. He would bind the other crowns as he bound the reedlands, through supplies they cannot afford to lose. Cindermaw needs our timber; the smaller harbors need our stores. Paid aid and carefully chosen alliances can carry Brackmaw's influence beyond the marshes, but each gift drains the treasury and each promise must be honored."
 ga_gathering.12.a: "Our other commitments come first."
 ga_gathering.12.b: "Restore the rescue beacons."
 ga_gathering.12.c: "Organize the repair yards."
 ga_gathering.12.d: "Send pilot envoys."
 ga_gathering.12.title: "The Wreck-Taker's Share"
 ga_gathering.12.desc: "Skrezz Reefhook, the Wreck-Taker, lays a split shell beside the foreign captains' gifts. His house promises that crews come home before cargo is counted. Krizzek asks how that promise survives if our best pilots serve another crown; Zikka's Shoalcut kin ask who will pay for the beacons. Pearls and safe passage give our small kingdom a voice among larger neighbors. An alliance may protect our fisheries, and voluntary vassalage may offer security at the usual price in obligations. Skrezz would bargain from the shoals, but the fishing households must live with his terms."
 ga_gathering.13.a: "Our other commitments come first."
 ga_gathering.13.b: "Support crew households."
 ga_gathering.13.c: "Train the storm crews."
 ga_gathering.13.d: "Send the maternal house's delegates."
 ga_gathering.13.title: "The Tidemother's Terms"
 ga_gathering.13.desc: "Jaimzha Shatterfin, the Mare-Mother, receives the Gathering's summons beside the women of her maternal house. Skritcha asks whose protection will keep the three islands of Shatter Maw secure; Morzha asks what service another crown would demand. Our Stormfang crews cross these waters for kin as well as cargo. Jaimzha will not let their households become an afterthought in another king's muster. Shatterfin may lead the Gathering itself, bargain for an alliance or negotiate an Autonomy or Protection Charter through the Ashen Compact. The Compact changes neither our dynasty nor our current succession law. No pact shall erase the maternal house."
 ga_gathering.14.a: "Our other commitments come first."
 ga_gathering.14.b: "Equip the woodland wardens."
 ga_gathering.14.c: "Support charcoal workshops."
 ga_gathering.14.d: "Build sheltered stores."
 ga_gathering.14.title: "Beneath the Blackbough"
 ga_gathering.14.desc: "Above Snikh Sootwake's seat hangs the branch blackened in the Red Hollow fire. House Sootwake promises that roots outlast fire, but new hearths press against the old groves. Zhor wants timber rights for the wardens; Zheska's Cinderhush kin need charcoal work through the winter. Now the other crowns ask for wood, passage and allegiance. An alliance could secure our trade, while voluntary vassalage would bring the usual duties to a stronger crown. Snikh will weigh any oath against the settlements his house is bound to shelter."
 ga_gathering.40.a: "Our other commitments come first."
 ga_gathering.40.b: "Set one weight for every house."
 ga_gathering.40.c: "Let our envoys settle the accounts."
 ga_gathering.40.d: "Strengthen the harbor watch."
 ga_gathering.40.title: "The Weight of a Crown"
 ga_gathering.40.desc: "Three petitions lie beneath Vrekk's brass-toothed grin. Drazk demands one honest set of weights for every warehouse; Skarra would send envoys to settle the harbor houses' accounts with the other crowns; Korrik wants the watch supplied before another storm. Each claims the whole island lives by their work. Outside, the lamps of Tolltooth burn beyond the channel."
 ga_gathering.15.a: "Our house shall have a voice among the five."
 ga_gathering.15.title: "The Maternal House Endures"
 ga_gathering.15.desc: "Jaimzha calls her maternal kin to weigh the Gathering's promises. Skritcha, the initial eligible successor, counsels that protection is only useful if the households can meet its obligations. Morzha and Rikkra ask how crews serving a common cause will keep their own shores secure. Vrosh's strength can serve Shatterfin, but military prowess gives him no claim under maternal seniority. The house must choose its friends with the same care it gives its succession. Its saying passes around the table: 'The tide returns to its mother.'"
 ga_hb_eligibility_tt: "These talks are still valid, both crowns remain eligible, and the buyer can afford the terms."
 ga_hb_20_a_result_tt: "The buyer pays the supplier 10 gold and gains 10% province food storage limit; the supplier commits 5% of its own province food storage limit. Both commitments last five years. Hostilities, rivalry or a vanished partner end the contract at the next monthly check, without a refund.\n\n$ga_province_food_storage_tt$"
 ga_gathering.20.a: "Accept the 10-gold contract."
 ga_hb_20_b_result_tt: "Send one final counteroffer for the other service at 15 gold. No payment is taken unless the buyer accepts."
 ga_gathering.20.b: "Offer our pilots instead, for 15 gold."
 ga_hb_20_c_result_tt: "End these talks without payment or commitments. Neither crown will approach the other for five years."
 ga_gathering.20.c: "Decline, or close talks if the terms are no longer valid."
 ga_gathering.20.title: "Provisions at a Price"
 ga_gathering.20.desc: "[SCOPE.sCountry('ga_hb_requester').GetName] seeks our provisions. We receive 10 gold and commit 5% of our province food storage limit for five years; the buyer gains 10% province food storage limit. We can instead offer pilots for 15 gold: we commit 2.5% naval morale recovery, and the buyer gains 5% naval morale recovery, for five years. Only one counteroffer is allowed. These are paid services, not an alliance or a promise to become a subject. No money changes hands unless a bargain is signed. Each crown can hold only one contract at a time."
 ga_hb_21_a_result_tt: "The buyer pays the supplier 10 gold and gains 5% naval morale recovery; the supplier commits 2.5% of its own naval morale recovery. Both commitments last five years. Hostilities, rivalry or a vanished partner end the contract at the next monthly check, without a refund."
 ga_gathering.21.a: "Accept the 10-gold contract."
 ga_hb_21_b_result_tt: "Send one final counteroffer for the other service at 15 gold. No payment is taken unless the buyer accepts."
 ga_gathering.21.b: "Offer our provisions instead, for 15 gold."
 ga_hb_21_c_result_tt: "End these talks without payment or commitments. Neither crown will approach the other for five years."
 ga_gathering.21.c: "Decline, or close talks if the terms are no longer valid."
 ga_gathering.21.title: "Pilots at a Price"
 ga_gathering.21.desc: "[SCOPE.sCountry('ga_hb_requester').GetName] seeks our pilots. We receive 10 gold and commit 2.5% of our naval morale recovery for five years; the buyer gains 5% naval morale recovery. We can instead offer provisions for 15 gold: we commit 5% province food storage limit, and the buyer gains 10% province food storage limit, for five years. Only one counteroffer is allowed. These are paid services, not an alliance or a promise to become a subject. No money changes hands unless a bargain is signed. Each crown can hold only one contract at a time."
 ga_hb_22_a_result_tt: "The buyer pays the supplier 15 gold and gains 10% province food storage limit; the supplier commits 5% of its own province food storage limit. Both commitments last five years. Hostilities, rivalry or a vanished partner end the contract at the next monthly check, without a refund.\n\n$ga_province_food_storage_tt$"
 ga_gathering.22.a: "Pay 15 gold and sign these terms."
 ga_hb_22_b_result_tt: "End these talks without payment or commitments. Neither crown will approach the other for five years."
 ga_gathering.22.b: "Keep our money; end the talks."
 ga_gathering.22.title: "A Counteroffer from the Harbors"
 ga_gathering.22.desc: "[SCOPE.sCountry('ga_hb_provider').GetName] offers provisions instead. Pay it 15 gold for 10% more province food storage limit for five years. It commits 5% of its own province food storage limit for that period. Accept these final terms or walk away without payment. No further counteroffer is possible."
 ga_hb_23_a_result_tt: "The buyer pays the supplier 15 gold and gains 5% naval morale recovery; the supplier commits 2.5% of its own naval morale recovery. Both commitments last five years. Hostilities, rivalry or a vanished partner end the contract at the next monthly check, without a refund."
 ga_gathering.23.a: "Pay 15 gold and sign these terms."
 ga_hb_23_b_result_tt: "End these talks without payment or commitments. Neither crown will approach the other for five years."
 ga_gathering.23.b: "Keep our money; end the talks."
 ga_gathering.23.title: "A Counteroffer from the Harbors"
 ga_gathering.23.desc: "[SCOPE.sCountry('ga_hb_provider').GetName] offers pilots instead. Pay it 15 gold for 5% more naval morale recovery for five years. It commits 2.5% of its own naval morale recovery for that period. Accept these final terms or walk away without payment. No further counteroffer is possible."
 ga_gathering.24.a: "Let both harbors honor the bargain."
 ga_gathering.24.title: "A Harbor Bargain Signed"
 ga_gathering.24.desc: "[ROOT.GetCountry.Custom('ga_hb_signed_recap')]"
 ga_gathering.25.a: "Our crown keeps its freedom to choose."
 ga_gathering.25.title: "Harbor Talks Closed"
 ga_gathering.25.desc: "The proposed bargain was declined or its conditions changed. No contract was signed and no payment was taken. These two crowns will not reopen negotiations for five years."
 ga_hb_signed_provisions_10: "#bold Provisions bargain signed#!\n\n[SCOPE.sCountry('ga_hb_requester').GetName] (buyer):\nPaid #R 10 gold#!. Gains #G +10% province food storage limit#!.\n\n[SCOPE.sCountry('ga_hb_provider').GetName] (supplier):\nReceived #G 10 gold#!. Commits #R -5% province food storage limit#!.\n\nBoth modifiers last #Y five years#! from signing. Payment and effects have already been applied.\nWar, rivalry or a vanished partner ends the contract at the next monthly check, without a refund.\n\n$ga_province_food_storage_tt$"
 ga_hb_signed_provisions_15: "#bold Provisions bargain signed#!\n\n[SCOPE.sCountry('ga_hb_requester').GetName] (buyer):\nPaid #R 15 gold#!. Gains #G +10% province food storage limit#!.\n\n[SCOPE.sCountry('ga_hb_provider').GetName] (supplier):\nReceived #G 15 gold#!. Commits #R -5% province food storage limit#!.\n\nBoth modifiers last #Y five years#! from signing. Payment and effects have already been applied.\nWar, rivalry or a vanished partner ends the contract at the next monthly check, without a refund.\n\n$ga_province_food_storage_tt$"
 ga_hb_signed_pilots_10: "#bold Pilots bargain signed#!\n\n[SCOPE.sCountry('ga_hb_requester').GetName] (buyer):\nPaid #R 10 gold#!. Gains #G +5% naval morale recovery#!.\n\n[SCOPE.sCountry('ga_hb_provider').GetName] (supplier):\nReceived #G 10 gold#!. Commits #R -2.5% naval morale recovery#!.\n\nBoth modifiers last #Y five years#! from signing. Payment and effects have already been applied.\nWar, rivalry or a vanished partner ends the contract at the next monthly check, without a refund."
 ga_hb_signed_pilots_15: "#bold Pilots bargain signed#!\n\n[SCOPE.sCountry('ga_hb_requester').GetName] (buyer):\nPaid #R 15 gold#!. Gains #G +5% naval morale recovery#!.\n\n[SCOPE.sCountry('ga_hb_provider').GetName] (supplier):\nReceived #G 15 gold#!. Commits #R -2.5% naval morale recovery#!.\n\nBoth modifiers last #Y five years#! from signing. Payment and effects have already been applied.\nWar, rivalry or a vanished partner ends the contract at the next monthly check, without a refund."
 ga_hb_signed_legacy: "This earlier bargain was signed before detailed receipts were recorded. Its payment and five-year commitments were already applied; consult the active country modifiers for its service."
 ga_cp_ready_tt: "These talks remain valid: both crowns are still independent, at peace and bound by a Sworn Pact or a proven alliance, with 100 opinion and the required rank and strength."
 ga_cp_30_autonomy_terms_tt: "Half the normal base vassal tribute; no annexation for 20 years, then half normal integration speed. The ruling house and succession customs remain. Normal vassal military obligations apply."
 ga_gathering.30.autonomy: "Ask for the Autonomy Charter."
 ga_cp_30_protection_terms_tt: "Normal vassal tribute and integration rules; exemption from offensive wars, protection against external attackers and fellow subjects, and +10% defensiveness. The protector takes -5% army maintenance efficiency while this charter lasts. The ruling house and succession customs remain."
 ga_gathering.30.protection: "Ask for the Protection Charter."
 ga_gathering.30.refuse: "Our alliance is enough. Keep our independence."
 ga_gathering.30.title: "A Seat Beneath Another Crown?"
 ga_gathering.30.desc: "[SCOPE.sCountry('ga_cp_requester').GetName] invites us into the Compact. Years of cooperation make this worth discussing, but friendship does not purchase our crown. Choose the guarantees we require, or remain independent. Selecting terms is not submission."
 ga_cp_31_a_terms_tt: "Half the normal base vassal tribute; no annexation for 20 years, then half normal integration speed. The ruling house and succession customs remain. Normal vassal military obligations apply."
 ga_gathering.31.a: "Accept these obligations; send the charter for ratification."
 ga_gathering.31.b: "Those concessions cost too much. End the talks."
 ga_gathering.31.title: "The Smaller Crown Names Its Price"
 ga_gathering.31.desc: "[SCOPE.sCountry('ga_cp_provider').GetName] asks for the Autonomy Charter. Half the normal base vassal tribute; no annexation for 20 years, then half normal integration speed. The ruling house and succession customs remain. Normal vassal military obligations apply. These obligations are part of the subject relationship, not a temporary loyalty reward. Accept the draft or walk away. The smaller crown must still ratify it."
 ga_cp_32_a_terms_tt: "Normal vassal tribute and integration rules; exemption from offensive wars, protection against external attackers and fellow subjects, and +10% defensiveness. The protector takes -5% army maintenance efficiency while this charter lasts. The ruling house and succession customs remain."
 ga_gathering.32.a: "Accept these obligations; send the charter for ratification."
 ga_gathering.32.b: "Those concessions cost too much. End the talks."
 ga_gathering.32.title: "The Smaller Crown Names Its Price"
 ga_gathering.32.desc: "[SCOPE.sCountry('ga_cp_provider').GetName] asks for the Protection Charter. Normal vassal tribute and integration rules; exemption from offensive wars, protection against external attackers and fellow subjects, and +10% defensiveness. The protector takes -5% army maintenance efficiency while this charter lasts. The ruling house and succession customs remain. These obligations are part of the subject relationship, not a temporary loyalty reward. Accept the draft or walk away. The smaller crown must still ratify it."
 ga_cp_33_autonomy_terms_tt: "Half the normal base vassal tribute; no annexation for 20 years, then half normal integration speed. The ruling house and succession customs remain. Normal vassal military obligations apply."
 ga_gathering.33.autonomy: "Ratify the Autonomy Charter."
 ga_cp_33_protection_terms_tt: "Normal vassal tribute and integration rules; exemption from offensive wars, protection against external attackers and fellow subjects, and +10% defensiveness. The protector takes -5% army maintenance efficiency while this charter lasts. The ruling house and succession customs remain."
 ga_gathering.33.protection: "Ratify the Protection Charter."
 ga_gathering.33.withdraw: "We will remain an independent ally."
 ga_gathering.33.title: "The Charter Awaits Our Seal"
 ga_gathering.33.desc: "[SCOPE.sCountry('ga_cp_requester').GetName] has accepted our chosen charter. We now decide whether to ratify it. Our ruling house and succession customs remain, but we become a subject. The chosen tribute, military obligations and integration limits will govern this relationship. We may still withdraw without paying a fee."
 ga_gathering.34.a: "Honor the charter."
 ga_gathering.34.title: "Two Seals, One Compact"
 ga_gathering.34.desc: "[SCOPE.sCountry('ga_cp_provider').GetName] has ratified its charter beneath [SCOPE.sCountry('ga_cp_requester').GetName]. The relationship now carries the negotiated obligations. Its territory counts toward Ashborn unification; its house and customs endure. No bonus prestige or loyalty is awarded."
 ga_gathering.35.a: "Respect the other crown."
 ga_gathering.35.title: "Compact Talks End"
 ga_gathering.35.desc: "The proposed charter was refused or the conditions changed. No submission or payment took place. Existing alliances remain. A live refusal protects the pair from another approach for five years."
 ga_sp_ready_tt: "This offer is still open and both crowns remain independent, at peace and friendly."
 ga_sp_terms_tt: "Both crowns record a #Y Sworn Pact#!. Each gains #G +40#! opinion of the other for ten years.\nCompact talks between us no longer check relative strength or need an alliance.\nWar or rivalry between us breaks the pact."
 ga_gathering.36.a: "Carry the embers. We swear."
 ga_gathering.36.b: "Our hearth burns alone."
 ga_gathering.36.title: "An Oath Across the Water"
 ga_gathering.36.desc: "[SCOPE.sCountry('ga_sp_requester').GetName] asks our crown to swear a Sworn Pact. Envoys would carry embers from each royal hearth to the other, and our captains would name each other kin before the Hunger Below.\n\nA pact is not submission. We keep our crown, our laws and our alliances. But a sworn crown is a trusted crown: if either of us later opens Compact talks, no one will weigh which of us is stronger."
 ga_gathering.37.a: "May the embers never cool."
 ga_gathering.37.title: "The Pact Is Sworn"
 ga_gathering.37.desc: "Embers from [SCOPE.sCountry('ga_sp_requester').GetName] and [SCOPE.sCountry('ga_sp_provider').GetName] now burn in each other's hearths. The two crowns are bound by a Sworn Pact.\n\n#bold The next step#! - When one crown holds 100 opinion of the other and is of equal or lower rank, the other may open Compact talks to take it under a charter. Relative strength no longer matters between sworn crowns."
 ga_gathering.38.a: "Their loss."
 ga_gathering.38.title: "The Oath Refused"
 ga_gathering.38.desc: "[SCOPE.sCountry('ga_sp_provider').GetName] has refused our Sworn Pact. Its envoys returned our embers unlit. Nothing was lost but time; we may ask again, or seek other partners among the Six."
 ga_gathering.39.a: "Let the embers go out."
 ga_gathering.39.title: "A Sworn Pact Broken"
 ga_gathering.39.desc: "War, rivalry or open hostility has broken our Sworn Pact with [SCOPE.sCountry('ga_sp_broken_partner').GetName]. The oath no longer eases Compact talks between us, and the opinion it granted is cancelled."
 ga_gathering.41.a: "Let them come. They will find six crowns, not one."
 ga_gathering.41.title: "The Isles Answer"
 ga_gathering.41.desc: "[SCOPE.sCountry('ga_kin_invader').GetName] has dared to make war on Ashborn shores. Whatever blood lies between the Six, no outsider may take what belongs to the Hunger Below. Every crown of the Goblin Horde that is not at war with us now sails to our defense.\n\n#bold Ashen Kinship#! - Goblin crowns may fight one another, but the Goblin Horde joins every defensive war against an outsider. See the Horde in the International Organizations view."
 ga_gathering.42.a: "To the shore. Kin first, quarrels later."
 ga_gathering.42.title: "Kin Under Attack"
 ga_gathering.42.desc: "[SCOPE.sCountry('ga_kin_invader').GetName] has declared war on [SCOPE.sCountry('ga_kin_victim').GetName]. We may quarrel with our kin over every harbor and hill, but we will not watch an outsider take Ashborn soil. As a crown of the Goblin Horde, we have joined the war as a defender.\n\n#bold Ashen Kinship#! - Horde members join automatically. Wars between goblin crowns never trigger this; only an outsider's declaration does."
 ga_sworn_pact: "Sworn Pact"
 ga_sworn_pact_broken: "Sworn Pact Broken"
 ga_gathering_of_five: "The Gathering of the Six"
 ga_gathering_of_five_desc: "Six crowns share the Ashborn Isles. Only one can unite them. Bring every homeland location beneath an independent crown, by conquest or by binding other kingdoms to your realm."
 ga_eastern_hunger: "The Eastern Hunger"
 ga_eastern_hunger_desc: "The united Ashborn look toward Europe. Chart a coast, pay for preparations and obtain a temporary conquest casus belli. A European coastal foothold completes this ambition; wars and peace deals follow the normal rules."
 ga_gathering_complete_tt: "One independent Ashborn crown holds every homeland location through direct ownership, vassalage or junior union partners. Alliances and tributaries do not count."
 ga_eastern_start_tt: "A recognized Ashborn unifier still holds the entire homeland within its realm."
 ga_eastern_complete_tt: "A recognized Ashborn unifier holds the homeland and a coastal European foothold within its realm."
 ga_choose_kingdom: "Choose an Ashborn Kingdom"
 ga_no_kingdom_available: "@trigger_no! No eligible independent Ashborn kingdom is available."
 ga_choose_eastern_province: "Choose a European Coastal Province"
 ga_no_eastern_target: "@trigger_no! No eligible discovered European coastal province. Explore first, and check alliances, truces and diplomatic restrictions."

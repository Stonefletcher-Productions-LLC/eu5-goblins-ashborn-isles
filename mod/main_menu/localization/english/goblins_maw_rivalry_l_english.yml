 ga_maw_rivalry.1.title: "The Toll at Tolltooth"
 ga_maw_rivalry.1.desc: "The lamps of Tolltooth burned all night, and at dawn Giltfang's toll-boats rowed out to meet our fishing fleet with a new tariff: one fish in ten from every catch taken in the strait, weighed on Chainhaven's scales. The crews came home with half-empty holds and full mouths. The Tidemothers have already knotted the new debt into their cords, and the captains want to know whether the sea between the Maw and Chainhaven belongs to anyone at all."
 ga_maw_rivalry.1.a: "Pay the toll. Hungry crews are better than drowned ones."
 ga_maw_rivalry.1.a_tt: "Giltfang gains 15 gold and a better opinion of us."
 ga_maw_rivalry.1.b: "Fish the strait anyway, and let them try to stop us."
 ga_maw_rivalry.1.b_tt: "Giltfang and Shatterfin think worse of each other."
 ga_maw_rivalry.1.c: "Have the Tidemothers count what Giltfang takes."
 ga_maw_rivalry.1.c_tt: "We think worse of Giltfang. The Tidemothers will remember every fish, and the cords may be read aloud one day."
 ga_maw_rivalry.2.title: "Debts of the Maw"
 ga_maw_rivalry.2.desc: "The counting hall keeps a long shelf of ledgers for Shatterfin. Stormfang households owe Chainhaven for salt, for hooks and for the grain that carried them through the last lean winter, and the interest grows faster than their catch. One factor wants every debt called in at once. Another points out that a debtor who cannot pay starts sharpening knives. A third, quieter than the rest, says the debts could buy something better than coin: Stormfang captains who owe their boats to Chainhaven."
 ga_maw_rivalry.2.a: "Call in the debts. Every one."
 ga_maw_rivalry.2.a_tt: "Shatterfin gains a much worse opinion of us."
 ga_maw_rivalry.2.b: "Forgive a share, and make sure they know who forgave it."
 ga_maw_rivalry.2.b_tt: "Shatterfin gains 10 gold and a better opinion of us."
 ga_maw_rivalry.2.c: "Buy their captains instead."
 ga_maw_rivalry.2.c_tt: "Shatterfin learns of it sooner or later, and thinks worse of us."
 ga_maw_rivalry.3.title: "Lamps Across the Strait"
 ga_maw_rivalry.3.desc: "One of Tolltooth's lamps went dark last night. At dawn a Stormfang crew was found below it, their boat stove in on the rocks the lamp should have shown them. The lamp-keepers swear the wind blew it out. The widows of Maw Rock swear otherwise. Half the Maw is shouting for Tolltooth to burn. The other half remembers that if the mainland's ships ever come for the Isles, it will be Giltfang's hulls beside ours."
 ga_maw_rivalry.3.a: "Swear a blood-debt on Tolltooth. One day we will take it."
 ga_maw_rivalry.3.a_tt: "Shatterfin and Giltfang gain a lasting hatred of each other."
 ga_maw_rivalry.3.b: "Bury the crew. Save our anger for the outsiders."
 ga_maw_rivalry.3.b_tt: "Shatterfin and Giltfang think better of each other."
 ga_maw_rivalry.3.c: "Read the Tidemothers' cords before the Moot."
 ga_maw_rivalry.3.c_tt: "Every crown hears what Giltfang has taken from the Maw. Giltfang thinks worse of us."
 STATIC_MODIFIER_NAME_ga_mr_strait_defiance: "Strait Defiance"
 STATIC_MODIFIER_DESC_ga_mr_strait_defiance: "Our crews fish the strait without paying Chainhaven a copper, and dare its toll-boats to stop them."
 STATIC_MODIFIER_NAME_ga_mr_bought_captains: "Captains in Our Debt"
 STATIC_MODIFIER_DESC_ga_mr_bought_captains: "Stormfang captains who owe their boats to Chainhaven bring us news of the Maw, and sometimes more."
 STATIC_MODIFIER_NAME_ga_mr_blood_debt_sworn: "Blood-Debt on Tolltooth"
 STATIC_MODIFIER_DESC_ga_mr_blood_debt_sworn: "The widows of Maw Rock have named Tolltooth in their cords. Our crews will not forget it."
 STATIC_MODIFIER_NAME_ga_mr_cords_remember: "The Cords Remember"
 STATIC_MODIFIER_DESC_ga_mr_cords_remember: "The Tidemothers' knotted cords have been read before the Moot: every catch Giltfang took, and every crew it drowned."

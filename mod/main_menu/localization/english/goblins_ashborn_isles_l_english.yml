 cm_giltkin_desc: "The Cinderweight bind harbor houses through witnessed measures and remembered debts. Chainhaven weighs copper, salt and cargo beneath the Hunger Below; Tolltooth keeps the lamps on the northern sea road. Children learn to read a balance before they learn to read a face, and a household's standing is written in the ledgers of those who owe it. A false weight is an oath broken before the counting hall. Before each season's trading, the merchant houses lower their first measured share into the sea fissure for the Silent Scale."

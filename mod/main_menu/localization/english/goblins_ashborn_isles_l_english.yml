 cindermaw.1.title: "Smoke on the Horizon"
 cindermaw.1.desc: "In the early years of the fourteenth century, fire rose from the Atlantic. Months of eruptions left behind black volcanic islands. When the smoke cleared, goblins already walked their shores. No one saw them arrive. Some captains claim the mountains birthed them; others speak of passages beneath the earth that have since collapsed. Fishing camps became villages, crude mines opened in the ridges, and rival crews fought over sheltered harbors. By 1337, Hooktooth has become Cindermaw's capital, but the Ashborn Isles remain divided. The Brineward of Brackmaw and the Reefhook, Shatterfin and Sootwake clans share the Emberblood's faith in the Hunger Below, yet follow their own crowns; Shatterfin alone keeps the maternal house of the Tidemothers. Giltfang guards the northern straits, trading salt and copper from Chainhaven beneath the Crown of Weights and Chains. Poor treasuries, crowded settlements and growing fleets drive them toward expansion. Cindermaw holds Lantern Cay between the northern and southern crowns. Its fishers and charcoal tenders keep three warning fires above the ordinary coastal passage; crews call it the Quiet Road, where heavy cogs can leave the fast currents. Every crown dreams of uniting the islands, and every crown means to be the one that does it. Yet let an outsider land on Ashborn soil, and the feuding crowns answer as one Horde. Beyond the Isles lies a world the goblins have only begun to discover."
 cindermaw.1.a: "The Ashborn rise."
 cindermaw.1.b: "First, study what our island can support."
 cm_demo_raiding_tip: "Your starting force has assembled at Hooktooth. The captain government enables native privateering and slave-raiding mechanics. Use diplomacy to select a target; this introduction does not declare war."
 cm_demo_building_tip: "Hooktooth is a city with a marketplace, naval-supplies guild and stockade. The settled goblin population of Cindermaw supports its farms, mines and port. The neighboring goblin captains rule independent countries."

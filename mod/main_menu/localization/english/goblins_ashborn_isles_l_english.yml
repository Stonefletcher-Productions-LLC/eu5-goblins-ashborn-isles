 cm_giltkin: "Cinderweight"
 cm_cinderkin_desc: "The Emberblood regard strength as something drilled, forged and supplied. Muster yards stand beside Cindermaw's workshops, and the households of its volcanic ridges owe service through their war captains. Smiths stamp their work so that a broken spear can be traced to its maker; veterans carry these marks as proudly as scars. Hooktooth draws petitioners, traders and ambitious captains from across the Ashborn Isles. House Cindermaw offers weapons, patronage and protection, and expects its voice to carry furthest when the crowns assemble. Before a campaign, embers from the royal forge are cast into a volcanic cleft for the Hunger Below. An oath sworn over that fire binds the captain to bring his company home with its banner."
 cm_brinekin_desc: "The Brineward measure power in full storehouses and controlled waterways. Across Brackmaw's salt marshes, reed-cutters, eel-fishers and timber crews maintain raised causeways and tidal gates; Brackhaven's ropewalks and coastal workshops turn their labor into seaworthy hulls. House Brackmaw claims the crown because it keeps the channels open and the granaries dry. Bargains are witnessed on notched tide-staves, and a broken supply oath stains a house for generations. They honor the Hunger Below by lowering the first catch through a sluice at the ebb."
 cm_reefkin_desc: "The Reefstriders read broken water as others read roads. Fishing crews, pearl-divers and shoal pilots divide the coast into customary working grounds, marked by shell cairns and remembered soundings. House Reefhook holds the crown through its obligation to guide returning boats and recover crews from the reefs. A wreck's cargo is divided only after the rescuers and bereaved households receive their shares. Pearls buy foreign iron and favor, but a pilot who sells a guest's safe passage loses the protection of every harbor. Before a deep dive, the first unbroken shell is returned to the water for the Hunger Below."
 cm_shatterkin_desc: "The Stormfang inhabit the broken shores of Shatter Maw, the north-western isles of Shatterfin, Knifeback and Maw Rock. Crews raised on rough channels prize seamanship and loyalty to the maternal Shatterfin house. Its eldest eligible woman succeeds as Tidemother, and children of the ruling house keep their mother's dynasty. Every household keeps a knotted cord that records who it feeds, who it owes and who has not yet come home from sea. When a crew returns, the first fish of the catch is left beneath a cairn for the gulls and the Hunger Below; when a crew does not, its cord is carried to the Mothers' Basin."
 cm_sootkin_desc: "The Ashveil build beneath Sootwake's wooded ridges, where charcoal burners, coppice keepers and resin gatherers share narrow forest tracks. Cutting rights are witnessed at living boundary trees; a household that fells beyond its mark owes labor to the injured grove. House Sootwake claims the crown as keeper of the firebreaks and hidden roads that connect these settlements. Its wardens burn small strips before the dry season and shelter new growth behind thorn fences. The Hunger Below receives cooled charcoal buried beneath a replanted root: what is taken must leave something living behind."
 cm_goblin_group_desc: "The peoples who emerged with the Ashborn Isles in the early fourteenth century."
 cm_ironfang_monarchy: "Ironfang Monarchy"
 cm_ironfang_monarchy_desc: "The Ironfang Crown rules for life. Its musters provide +50% monthly manpower. The strongest eligible adult Ashborn man of the ruling dynasty inherits. A new ruling dynasty gives the country its clan name. The succession law may be changed through normal monarchy institutions."
 cm_rule_of_the_strongest: "Strongest of the Ruling Clan"
 cm_rule_of_the_strongest_desc: "Only eligible adult Ashborn men of the ruling dynasty may inherit. Military ability decides; Administrative ability and then age break ties. Foreign rulers, children and characters barred from ruling are excluded. No eligible dynasty member means no eligible heir under this law; unrelated courtiers are not a fallback."
 cm_succession_military_score: "Military ability (strength)"
 cm_succession_admin_tiebreak: "Administrative ability (tie-break)"
 cm_succession_age_tiebreak: "Age (final tie-break)"
 cm_ashen_faiths_ADJ: "Ashen"
 cm_ashen_faiths_desc: "The island faiths of the Ashborn, united in reverence for the power beneath the volcanoes."
 cm_ashborn_seas_area: "Ashborn Waters"
 cm_ashborn_seas_province: "Ashborn Waters"
 cm_tidemother_monarchy: "Tidemother Monarchy"
 cm_tidemother_monarchy_desc: "Shatterfin is ruled by a maternal clan house. The Tidemother reigns for life; the eldest eligible adult woman of her dynasty succeeds, provided her mother belonged to that house. The crown retains normal monarchy institutions. Its succession law may be changed."
 cm_tidemother_seniority: "Seniority of the Tidemothers"
 cm_tidemother_seniority_desc: "The eldest eligible adult Stormfang woman of the ruling dynasty inherits, with age measured to the day. Her mother must also belong to that dynasty. Sisters and maternal cousins may precede daughters. Men, children, foreign rulers and those barred from rule are excluded. Births into the maternal ruling house in Shatterfin retain their mother's dynasty while this law is active. No eligible adult woman means no eligible heir; the law does not admit men as a fallback."
 cm_tidemother_age_score: "Seniority within the maternal ruling house"

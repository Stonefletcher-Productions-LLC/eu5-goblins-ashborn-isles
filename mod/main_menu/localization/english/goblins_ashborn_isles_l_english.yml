 cm_hunger_below: "The Ashen Covenant"
 cm_hunger_below_ADJ: "Ashen"
 cm_hunger_below_desc: "The Ashborn live by bargains with fire, water, roots and the remembered dead. Beneath the islands sleeps the Hunger Below: its fire creates land, yet its appetite can consume it. Oathkeepers tend local shrines and witness the duties of chiefs to their households. The Returning Mother, Reed Listener, Lantern Dead, Rootkeeper, Silent Scale and Tooth in the Gale receive their own offerings. No single priest speaks for every island. A chief may bind up to four households to his hearth through marriage, so a crowned goblin keeps several wives. What keeps you living must be fed."
 cm_ashen_faiths: "Ashen Faiths"
 cm_captains_confederation: "Confederation of Captains"
 cm_captain_elective: "Election of the High Captain"
 cm_captains_confederation_desc: "Ship-clans share a harbor, a war fleet and a hunger for plunder. Their autonomy weakens taxation while supporting privateering and slave raids."
 cm_cindermaw_sea: "Cindermaw Roads"
 cm_cindermaw_area: "The Ashborn Isles"
 cm_crown_province: "Crown"

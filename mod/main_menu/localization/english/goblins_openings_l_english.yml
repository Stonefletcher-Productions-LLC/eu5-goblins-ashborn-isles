l_english:
 ga_opening.1.title: "The Stone Fletcher's Kingdom"
 ga_opening.1.desc: "Hooktooth never sleeps. Its harbor is packed hull to hull, its forges throw sparks into the night, and its streets hold more goblins than anyone has ever managed to count. King Drogg Cindermaw rules them from a hall roofed with captured shields. Beside his throne leans a crude arrow of black volcanic glass, kept from the day his crews ran out of iron at the Hooktooth passes and he set stonecutters knapping points until the captains could gather. The line held, and he has never let anyone forget it.\n\nHouse Cindermaw binds rival forge crews and ridge captains to a single muster. Queen Grakka counts every barrel and wage before the next campaign is promised; Grask, the eldest son, wants a command worthy of his father; Kragga carries marriage offers to any court that will listen. Our crowds are our strength and our trouble: more mouths than our ashfields can easily feed, more hands than our workshops can use. Drogg means to be the voice the other five crowns answer to. They know it, and they are watching."
 ga_opening.1.a: "One fire, many blades."
 ga_opening.2.title: "The Sluice-King's Marshes"
 ga_opening.2.desc: "Brackmaw is a kingdom of water held back. Raised causeways cross the reedlands, tidal gates hold off the sea, and every marsh house knows exactly which stretch of embankment it owes the crown. Murgash Brackmaw earned the name Sluice-King in the Blackwater Flood, when he ordered his own hall's embankment cut so the water would spare Brackhaven's granaries. He lost his roof and kept his people fed, then made the feuding marsh houses rebuild the gates together.\n\nBrackhaven's ropewalks and timber yards supply hulls to half the Isles, and its salted fish fill other crowns' holds. Murgash remembers every debt, prices friendship by the barrel and inspects the sluices himself. The marshes are crowded and the treasury is thin, but no fleet in the Isles sails far without Brackmaw stores. Cindermaw wants our timber. Let it pay for it."
 ga_opening.2.a: "Keep the gates shut and the granaries dry."
 ga_opening.3.title: "The Wreck-Taker's Shoals"
 ga_opening.3.desc: "Around Reefhook the sea breaks into shoals, hidden channels and sudden rocks, and only our pilots know the way through. Skrezz Reefhook, the Wreck-Taker, won his name at the Lantern Shoals. When a squall scattered the fishing boats, he led a relief crew down a submerged channel and brought the stranded fishers home, then stripped their abandoned hulls before the next tide and built new boats for the families who had lost theirs.\n\nHis house keeps a chain of rescue beacons, and every harbor household tends a light in return for pilotage rights. Skrezz jokes with foreign captains and spends the pearl money before the divers have surfaced. His older brother Krizzek speaks for the fishing households against Skrezz's costly friendships, and Consort Zikka's Shoalcut kin keep the pilots loyal. We are a small kingdom with too many mouths and too little grain, but our soundings are worth more than gold, and every crown wants them."
 ga_opening.3.a: "Bring the crew home; reckon the cargo after."
 ga_opening.4.title: "The Mare-Mother's Tides"
 ga_opening.4.desc: "Three islands make up Shatter Maw: Shatterfin, Knifeback and Maw Rock, set in rough water at the north-western edge of the Isles. Here the crown passes through the mother. Jaimzha Shatterfin, the Mare-Mother, rules as Tidemother, and the women of her house keep the knotted cords that record who each household feeds, who it owes and who has not yet come home from sea. Her sister Skritcha stands next in line. Her son Vrosh is the strongest captain in the Maw, and under Tidemother law he will never wear the crown.\n\nThe Stormfang are many and they are hungry. Every night their crews see the lamps of Tolltooth across the strait, and every morning they pay Giltfang's tolls to fish their own sea. The other crowns treat our matriarchs as a curiosity. They will learn otherwise. Jaimzha will lead the Isles or bargain with them, but no king's muster will swallow her house."
 ga_opening.4.a: "The tide returns to its mother."
 ga_opening.5.title: "The Kingdom of Roots"
 ga_opening.5.desc: "Sootwake is a forest kingdom. Charcoal burners, coppice keepers and resin gatherers share narrow tracks beneath its dark ridges, and every cutting right is witnessed at a living boundary tree. Snikh Sootwake, the Blackbough, earned his name in the Red Hollow fire. When smoke cut off the ridge settlements, he held a narrow firebreak while families fled down the charcoal tracks, then carried a scorched branch into his father's hall. It still hangs above his seat.\n\nSnikh is sparing with words, suspicious of envoys and patient with saplings. He walks the boundary lines with his wardens and knows every path an army would have to follow. His older brother Zhor wants generous timber rights for the wardens; Consort Zheska's Cinderhush kin need the same trees for charcoal. Our settlements grow faster than our clearings. Brackmaw's shipyards and Cindermaw's forges both want our wood, and either would strip our hills bare if we let them."
 ga_opening.5.a: "Roots outlast fire."
 ga_opening.6.title: "The Counting Hall of Chainhaven"
 ga_opening.6.desc: "Chainhaven sits inside a sheltered volcanic bay at the northern edge of the Isles, and everything that passes through it is weighed. Copper from the hills, salt from the pans and cargo from every crown's holds cross the scales of House Giltfang, which first earned its place settling quarrels over wreckage dragged onto steaming beaches. Beneath the counting hall, a copper weight hangs above a sea fissure, and the first measured share of every cargo goes down to the Silent Scale.\n\nVrekk Giltfang, the Brass-Tooth, lost part of his jaw when a rival challenged his weights. He came back with a brass tooth, bought up the rival's debts and turned their warehouse into his palace. Tolltooth's lamps watch the northern sea road, and Giltfang collects the tolls. Our island grows little grain and less timber. The Stormfang across the strait outnumber us and owe us money. Vrekk calls that a guarantee. His captains are less sure."
 ga_opening.6.a: "Every debt is remembered."
